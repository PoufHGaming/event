<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Stream Overlay – Gloire à la Compagnie</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Crimson+Pro:ital,wght@0,300;1,300&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: transparent;
      font-family: 'Crimson Pro', Georgia, serif;
      font-weight: 300;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    :root {
      --gold:       #c9a84c;
      --gold-light: #e8c96a;
      --gold-dim:   #9a7a3a;
      --border:     rgba(201,168,76,0.25);
      --bg:         rgba(6,5,3,0.93);
      --teal:       #4ca8a8;
    }

    /* ── PANEL PRINCIPAL ── */
    #panel {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      width: 480px;
      overflow: hidden;
      backdrop-filter: blur(12px);
      box-shadow: 0 8px 32px rgba(0,0,0,0.6);
    }

    /* Header */
    .so-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 18px;
      border-bottom: 1px solid var(--border);
      background: rgba(201,168,76,0.05);
    }

    .so-header-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .so-logo {
      font-family: 'Cinzel', serif;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--gold);
    }

    .so-season {
      font-size: 12px;
      color: #9a8a5a;
      font-style: italic;
    }

    .so-header-label {
      font-family: 'Cinzel', serif;
      font-size: 9px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--gold-dim);
    }

    /* Liste HF */
    .so-list {
      padding: 8px 0;
    }

    .so-entry {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      padding: 10px 16px;
      border-bottom: 1px solid rgba(201,168,76,0.07);
      transition: background 0.2s;
    }

    .so-entry:last-child { border-bottom: none; }

    /* Numéro */
    .so-num {
      font-family: 'Cinzel', serif;
      font-size: 11px;
      color: var(--gold-dim);
      width: 18px;
      flex-shrink: 0;
      padding-top: 3px;
      text-align: right;
    }

    /* Corps */
    .so-body { flex: 1; min-width: 0; }

    .so-title {
      font-family: 'Cinzel', serif;
      font-size: 15px;
      font-weight: 600;
      color: #f0e8d0;
      line-height: 1.3;
      margin-bottom: 3px;
    }

    .so-dungeon {
      font-size: 11px;
      color: var(--gold-dim);
      font-style: italic;
      letter-spacing: 0.06em;
      margin-bottom: 4px;
      text-transform: uppercase;
      font-family: 'Cinzel', serif;
    }

    .so-desc {
      font-size: 13px;
      color: #b8aa88;
      font-style: italic;
      line-height: 1.5;
    }

    /* Conditions */
    .so-conds {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      flex-shrink: 0;
      padding-top: 2px;
    }

    .so-cond-img {
      width: 20px;
      height: 20px;
      object-fit: contain;
      opacity: 0.85;
    }

    /* Accent coloré par donjon */
    .so-accent {
      width: 3px;
      border-radius: 2px;
      flex-shrink: 0;
      align-self: stretch;
      min-height: 36px;
    }

    /* Footer */
    .so-footer {
      padding: 8px 18px;
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(201,168,76,0.03);
    }

    .so-footer-text {
      font-size: 11px;
      color: var(--gold-dim);
      font-style: italic;
      letter-spacing: 0.06em;
    }

    .so-footer-url {
      font-size: 10px;
      color: #5a5040;
      letter-spacing: 0.08em;
      font-family: 'Cinzel', serif;
    }

    /* État vide / erreur */
    .so-empty {
      padding: 32px 20px;
      text-align: center;
      color: rgba(201,168,76,0.35);
      font-style: italic;
      font-size: 14px;
    }
  </style>
</head>

</div>

  const HF_MAP = {};
  ALL_HFS.forEach(h => HF_MAP[h.id] = h);

  const DUNGEON_COLORS = {
    "Abime des marins":"#3a7a9c","Bois de L'aube":"#5a8a3a","Carrière tombe-dieu":"#7a5a3a",
    "Caveau de Lamespectre":"#4a5a8a","Coeur de guivre":"#6a9aaa","Coeur de Tuzari":"#7a4a2a",
    "Creux Soyeux":"#8a6a3a","Guet Tempete":"#6a6aaa","La chute Cithrel":"#9a5a4a",
    "Marché d'Urrak":"#8a7a3a","Sables Empyréens":"#c9a84c","Saccage de Drakheim":"#5a3a8a",
    "Ruins of Regath":"#8a3a3a","Scryer's Peak":"#4a7aaa","Xul, the Blood Monolith":"#9a3a5a",
  };

  // ── LECTURE PARAMS URL ──
  const params  = new URLSearchParams(window.location.search);
  const lang    = params.get('lang') || 'fr';
  const hfIds   = (params.get('hf') || '').split(',').map(Number).filter(Boolean);

  // Appliquer langue
  document.documentElement.lang = lang;
  document.getElementById('so-label').textContent    = lang === 'en' ? 'Current objectives' : 'Objectifs en cours';
  document.getElementById('so-footer-text').textContent = lang === 'en' ? '✦ Live on Twitch' : '✦ En direct sur Twitch';

  // ── RENDU ──
  const list = document.getElementById('so-list');

  if (!hfIds.length) {
    list.innerHTML = `<div class="so-empty">${lang === 'en' ? 'No achievement selected.' : 'Aucun haut-fait sélectionné.'}</div>`;
  } else {
    list.innerHTML = hfIds.map((id, i) => {
      const hf = HF_MAP[id];
      if (!hf) return '';

      const title    = (lang === 'en' && hf.title_en) ? hf.title_en : hf.title;
      const desc     = (lang === 'en' && hf.desc_en)  ? hf.desc_en  : hf.desc;
      const location = hf.dungeon || hf.affix || '';
      const color    = hf.dungeon ? (DUNGEON_COLORS[hf.dungeon] || 'var(--gold-dim)') : 'var(--gold-dim)';

      const condsHtml = (hf.conditions || []).map(c =>
        `<img class="so-cond-img" src="images/conditions/${c}.png" alt="${c}" title="${c}" onerror="this.style.display='none'">`
      ).join('');

      const timerBadge = hf.timed
        ? `<img class="so-cond-img" src="images/conditions/timer.png" alt="timer" title="${lang === 'en' ? 'Timed' : 'Timer'}" onerror="this.style.display='none'">`
        : '';

      return `<div class="so-entry">
        <div class="so-accent" style="background:${color}"></div>
        <div class="so-num">${i + 1}.</div>
        <div class="so-body">
          <div class="so-dungeon">${location}</div>
          <div class="so-title">${title}</div>
          <div class="so-desc">${desc}</div>
        </div>
        ${(condsHtml || timerBadge) ? `<div class="so-conds">${timerBadge}${condsHtml}</div>` : ''}
      </div>`;
    }).join('');
  }
</script>
