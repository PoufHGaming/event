<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Overlay – Gloire à la Compagnie</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Crimson+Pro:ital,wght@0,300;1,300&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: transparent;
      font-family: 'Crimson Pro', Georgia, serif;
      font-weight: 300;
      width: 1920px; height: 1080px;
      overflow: hidden;
    }

    :root {
      --gold:        #c9a84c;
      --gold-light:  #e8c96a;
      --gold-dim:    #9a7a3a;
      --border:      rgba(201,168,76,0.22);
      --bg:          rgba(6,5,3,0.94);
      --teal:        #4ca8a8;
    }

    /* ── PANEL VERTICAL ────────────────────────────── */
    #overlay {
      position: absolute;
      top: 0; left: 0;
      width: 340px;
      display: flex;
      flex-direction: column;
      background: var(--bg);
      border-right: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
      border-bottom-right-radius: 10px;
      backdrop-filter: blur(12px);
      overflow: hidden;
    }

    /* Header fixe */
    .ov-header {
      padding: 14px 18px 11px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
      background: rgba(201,168,76,0.04);
    }
    .ov-title {
      font-family: 'Cinzel', serif;
      font-size: 14px; font-weight: 700;
      letter-spacing: 0.18em; text-transform: uppercase;
      color: var(--gold); line-height: 1;
    }
    .ov-season {
      font-size: 13px; color: #9a8a5a;
      font-style: italic; margin-top: 4px;
    }

    /* Indicateurs de module (dots) */
    .ov-dots {
      display: flex; gap: 6px;
      padding: 8px 18px 0;
      flex-shrink: 0;
    }
    .ov-dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: rgba(201,168,76,0.2);
      transition: background 0.4s, transform 0.4s;
    }
    .ov-dot.active {
      background: var(--gold);
      transform: scale(1.4);
    }

    /* Zone de contenu carousel */
    .ov-body {
      flex: 1;
      position: relative;
      overflow: hidden;
    }

    /* Module générique */
    .ov-module {
      position: absolute;
      inset: 0;
      opacity: 0;
      transition: opacity 0.6s ease;
      pointer-events: none;
      display: flex;
      flex-direction: column;
    }
    .ov-module.visible {
      opacity: 1;
      pointer-events: auto;
    }

    .ov-module-label {
      font-family: 'Cinzel', serif;
      font-size: 9px; font-weight: 600;
      letter-spacing: 0.24em; text-transform: uppercase;
      color: var(--gold-dim);
      padding: 10px 18px 6px;
      flex-shrink: 0;
    }

    /* ── MODULE CLASSEMENT ── */
    .ov-lb-entry {
      display: flex; align-items: center; gap: 10px;
      padding: 10px 18px;
      border-top: 1px solid rgba(201,168,76,0.08);
    }
    .ov-lb-entry:first-child { border-top: none; }

    .ov-lb-rank {
      font-family: 'Cinzel', serif;
      font-size: 14px; font-weight: 600;
      color: var(--gold-dim);
      width: 22px; text-align: right; flex-shrink: 0;
    }
    .ov-lb-rank.r1 { color: #ffd700; font-size: 18px; }
    .ov-lb-rank.r2 { color: #d8d8d8; font-size: 16px; }
    .ov-lb-rank.r3 { color: #cd8c32; font-size: 15px; }

    .ov-lb-name {
      font-family: 'Cinzel', serif;
      font-size: 18px; font-weight: 600;
      color: #f0e8d0;
      flex: 1; overflow: hidden;
      text-overflow: ellipsis; white-space: nowrap;
    }
    .ov-lb-rank.r1 ~ .ov-lb-name { color: #fff8e0; }

    .ov-lb-pts {
      font-size: 17px; font-weight: 600;
      color: var(--gold); font-style: italic;
      flex-shrink: 0;
    }

    /* ── MODULE HF ── */
    .ov-hf-dungeon {
      font-family: 'Cinzel', serif;
      font-size: 11px; letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--gold);
      padding: 8px 18px 4px;
      flex-shrink: 0;
    }

    .ov-hf-list {
      padding: 4px 14px 12px;
      display: flex; flex-direction: column; gap: 8px;
      overflow-y: auto;
    }

    .ov-hf-entry {
      padding: 10px 14px;
      border-left: 3px solid var(--gold-dim);
      background: rgba(201,168,76,0.05);
      border-radius: 0 4px 4px 0;
    }

    .ov-hf-name {
      font-family: 'Cinzel', serif;
      font-size: 15px; font-weight: 600;
      color: #f0e8d0; line-height: 1.3;
    }

    .ov-hf-desc {
      font-size: 14px; color: #c8b880;
      font-style: italic; line-height: 1.5;
      margin-top: 4px;
    }

    /* ── MODULE MESSAGE ── */
    .ov-pub {
      flex: 1;
      display: flex; align-items: center; justify-content: center;
      padding: 20px 22px;
      text-align: center;
    }

    .ov-pub-text {
      font-size: 20px; color: #f0e8d0;
      font-style: italic; font-weight: 300;
      line-height: 1.55;
    }

    /* Barre de progression du timer */
    .ov-progress {
      height: 2px;
      background: rgba(201,168,76,0.15);
      flex-shrink: 0;
      position: relative;
      overflow: hidden;
    }

    .ov-progress-bar {
      position: absolute;
      top: 0; left: 0; bottom: 0;
      background: var(--gold);
      transition: width linear;
    }

    .empty {
      color: rgba(201,168,76,0.3);
      font-style: italic; font-size: 14px;
      padding: 20px; text-align: center;
    }
  </style>
</head>
<body>

<div id="overlay">

  <!-- Header -->
  <div class="ov-header">
    <div class="ov-title">Gloire à la Compagnie</div>
    <div class="ov-season" id="ov-season-label">Pré-Saison 3</div>
  </div>

  <!-- Dots -->
  <div class="ov-dots" id="ov-dots"></div>

  <!-- Carousel body -->
  <div class="ov-body" id="ov-body">

    <!-- Module 0 : Classement -->
    <div class="ov-module" id="mod-lb">
      <div class="ov-module-label">Classement</div>
      <div id="ov-lb-list"></div>
    </div>

    <!-- Module 1 : Message -->
    <div class="ov-module" id="mod-pub">
      <div class="ov-module-label">Info</div>
      <div class="ov-pub"><div class="ov-pub-text" id="ov-pub-text"></div></div>
    </div>

    <!-- Module 2 : HF -->
    <div class="ov-module" id="mod-hf">
      <div class="ov-module-label">Hauts-faits · <span id="ov-hf-dungeon" style="color:var(--gold);font-style:italic;"></span></div>
      <div class="ov-hf-list" id="ov-hf-list"></div>
    </div>

  </div>

  <!-- Barre de progression -->
  <div class="ov-progress">
    <div class="ov-progress-bar" id="ov-progress-bar"></div>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>

  const supa = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON);

  // ── DONNÉES HF ────────────────────────────────────
  const HF_S2 = [

    {id:4,p:10,d:"Bois de L'aube"},{id:5,p:10,d:"Bois de L'aube"},{id:6,p:20,d:"Bois de L'aube"},

    {id:16,p:10,d:"Coeur de guivre"},{id:17,p:10,d:"Coeur de guivre"},{id:18,p:20,d:"Coeur de guivre"},
    {id:19,p:10,d:"Coeur de Tuzari"},{id:20,p:10,d:"Coeur de Tuzari"},{id:21,p:10,d:"Coeur de Tuzari"},{id:22,p:10,d:"Coeur de Tuzari"},{id:23,p:10,d:"Coeur de Tuzari"},{id:24,p:20,d:"Coeur de Tuzari"},
    {id:25,p:10,d:"Creux Soyeux"},{id:26,p:10,d:"Creux Soyeux"},{id:27,p:20,d:"Creux Soyeux"},
    {id:28,p:10,d:"Guet Tempete"},{id:29,p:10,d:"Guet Tempete"},{id:30,p:20,d:"Guet Tempete"},
    {id:31,p:10,d:"La chute Cithrel"},{id:32,p:10,d:"La chute Cithrel"},{id:33,p:20,d:"La chute Cithrel"},

    {id:37,p:10,d:"Sables Empyréens"},{id:38,p:10,d:"Sables Empyréens"},{id:39,p:20,d:"Sables Empyréens"},
    {id:40,p:10,d:"Saccage de Drakheim"},{id:41,p:10,d:"Saccage de Drakheim"},{id:42,p:10,d:"Saccage de Drakheim"},{id:43,p:10,d:"Saccage de Drakheim"},{id:44,p:10,d:"Saccage de Drakheim"},{id:45,p:10,d:"Saccage de Drakheim"},{id:46,p:10,d:"Saccage de Drakheim"},{id:47,p:10,d:"Saccage de Drakheim"},{id:48,p:20,d:"Saccage de Drakheim"},
  ];
  const DUNGEONS_S2 = ["Abime des marins","Bois de L'aube","Carrière tombe-dieu","Coeur de guivre","Creux Soyeux","Guet Tempete","Marché d'Urrak","Sables Empyréens","Caveau de Lamespectre","Coeur de Tuzari","La chute Cithrel","Saccage de Drakheim"];
  const HF_S3_DUNGEONS = [
    {id:49,p:10,d:"Marché d'Urrak"},{id:50,p:10,d:"Guet Tempete"},{id:51,p:10,d:"Sables Empyréens"},
    {id:52,p:10,d:"Creux Soyeux"},{id:53,p:10,d:"Carrière tombe-dieu"},{id:54,p:10,d:"Abime des marins"},
    {id:55,p:10,d:"Coeur de guivre"},{id:56,p:10,d:"Caveau de Lamespectre"},{id:57,p:10,d:"Bois de L'aube"},
    {id:58,p:10,d:"La chute Cithrel"},{id:59,p:10,d:"Coeur de Tuzari"},{id:60,p:10,d:"Saccage de Drakheim"},
    {id:61,p:10,d:"Ruins of Regath"},{id:62,p:10,d:"Scryer's Peak"},{id:63,p:10,d:"Xul, the Blood Monolith"},
    {id:64,p:10,d:"Marché d'Urrak"},{id:65,p:10,d:"Guet Tempete"},{id:66,p:10,d:"Sables Empyréens"},
    {id:67,p:10,d:"Coeur de Tuzari"},{id:68,p:10,d:"Coeur de guivre"},{id:69,p:10,d:"Ruins of Regath"},
    {id:70,p:10,d:"Caveau de Lamespectre"},{id:71,p:10,d:"Creux Soyeux"},{id:72,p:10,d:"Bois de L'aube"},
    {id:73,p:10,d:"Scryer's Peak"},{id:74,p:10,d:"Abime des marins"},{id:75,p:10,d:"La chute Cithrel"},
    {id:96,p:10,d:"Carrière tombe-dieu"},{id:97,p:10,d:"Saccage de Drakheim"},{id:98,p:10,d:"Xul, the Blood Monolith"},
    {id:99,p:10,d:"Coeur de guivre"},{id:100,p:10,d:"Marché d'Urrak"},{id:101,p:10,d:"Abime des marins"},
    {id:102,p:10,d:"Bois de L'aube"},{id:103,p:10,d:"Caveau de Lamespectre"},{id:104,p:10,d:"Saccage de Drakheim"},
    {id:105,p:10,d:"Coeur de Tuzari"},{id:106,p:10,d:"Creux Soyeux"},{id:108,p:10,d:"Guet Tempete"},
    {id:110,p:10,d:"La chute Cithrel"},{id:111,p:10,d:"Ruins of Regath"},{id:112,p:10,d:"Sables Empyréens"},
    {id:113,p:10,d:"Scryer's Peak"},{id:114,p:10,d:"Xul, the Blood Monolith"},
    {id:115,p:10,d:"Xul, the Blood Monolith"},{id:116,p:10,d:"Xul, the Blood Monolith"},
    {id:117,p:10,d:"Xul, the Blood Monolith"},{id:118,p:10,d:"Xul, the Blood Monolith"},
    {id:119,p:10,d:"Xul, the Blood Monolith"},{id:120,p:10,d:"Xul, the Blood Monolith"},
  ];
  const HF_S3_AFFIXES = [
    {id:76,p:10},{id:77,p:10},{id:78,p:10},{id:79,p:10},{id:80,p:10},
    {id:81,p:10},{id:82,p:10},{id:83,p:10},{id:84,p:10},{id:85,p:10},
    {id:86,p:10},{id:87,p:10},{id:88,p:10},{id:89,p:10},{id:90,p:10},
    {id:91,p:10},{id:92,p:10},{id:93,p:10},{id:94,p:10},{id:95,p:10},
    {id:107,p:10},{id:109,p:10},{id:121,p:10},{id:122,p:10},
  ];
  const DUNGEONS_S3 = ["Abime des marins","Bois de L'aube","Carrière tombe-dieu","Coeur de guivre","Creux Soyeux","Guet Tempete","Marché d'Urrak","Sables Empyréens","Caveau de Lamespectre","Coeur de Tuzari","La chute Cithrel","Saccage de Drakheim","Ruins of Regath","Scryer's Peak","Xul, the Blood Monolith"];

  // ── CALCUL SCORES ─────────────────────────────────
  function computeScores(players, completions, season) {
    let hfs, dungeons;
    if (season === 'S2')      { hfs = HF_S2; dungeons = DUNGEONS_S2; }
    else if (season === 'S3') { hfs = [...HF_S3_DUNGEONS, ...HF_S3_AFFIXES]; dungeons = DUNGEONS_S3; }
    else                      { hfs = [...HF_S2, ...HF_S3_DUNGEONS, ...HF_S3_AFFIXES]; dungeons = [...new Set([...DUNGEONS_S2, ...DUNGEONS_S3])]; }
    const hfMap = {};
    hfs.forEach(h => hfMap[h.id] = h);
    const byPlayer = {};
    players.forEach(p => byPlayer[p.id] = new Set());
    completions.forEach(c => { if (byPlayer[c.player_id]) byPlayer[c.player_id].add(c.achievement_id); });
    return players.map(p => {
      const done = byPlayer[p.id];
      let base = 0;
      done.forEach(aid => { if (hfMap[aid]) base += hfMap[aid].p; });
      let bonus = 0;
      dungeons.forEach(d => {
        const dHfs = hfs.filter(h => h.d === d);
        if (dHfs.length && dHfs.every(h => done.has(h.id))) bonus += 5;
      });
      return { id: p.id, name: p.name, total: base + bonus };
    }).sort((a, b) => b.total - a.total).slice(0, 5);
  }

  // ── ÉTAT ──────────────────────────────────────────
  let state         = null;
  let rawPlayers    = null;
  let rawCompletions = null;

  // ── CAROUSEL ──────────────────────────────────────
  // Modules : 0=LB(30s), 1=Pub(30s), 2=HF(60s)
  const MODULES    = ['mod-lb', 'mod-pub', 'mod-hf'];
  const DURATIONS  = [30, 30, 60]; // secondes
  let   carouselIdx = 0;
  let   carouselTimer = null;
  let   progressTimer = null;

  function buildDots() {
    const el = document.getElementById('ov-dots');
    el.innerHTML = MODULES.map((_, i) =>
      `<div class="ov-dot" id="dot-${i}"></div>`
    ).join('');
  }

  function showModule(idx) {
    MODULES.forEach((id, i) => {
      document.getElementById(id).classList.toggle('visible', i === idx);
      document.getElementById('dot-' + i).classList.toggle('active', i === idx);
    });
    carouselIdx = idx;
    startProgress(DURATIONS[idx]);
  }

  function nextModule() {
    const activeModules = getActiveModules();
    if (!activeModules.length) return;
    const currentPos = activeModules.indexOf(carouselIdx);
    const nextPos    = (currentPos + 1) % activeModules.length;
    showModule(activeModules[nextPos]);
  }

  function getActiveModules() {
    if (!state) return [0];
    const active = [];
    if (state.show_leaderboard) active.push(0);
    if (state.show_pub && state.pub_text) active.push(1);
    if (state.show_hfs && (state.hf_data || []).length) active.push(2);
    return active.length ? active : [0];
  }

  function startProgress(seconds) {
    clearInterval(progressTimer);
    clearTimeout(carouselTimer);
    const bar = document.getElementById('ov-progress-bar');
    const ms  = seconds * 1000;
    const start = Date.now();

    bar.style.transition = 'none';
    bar.style.width = '100%';

    requestAnimationFrame(() => {
      requestAnimationFrame(() => {
        bar.style.transition = `width ${ms}ms linear`;
        bar.style.width = '0%';
      });
    });

    carouselTimer = setTimeout(nextModule, ms);
  }

  function restartCarousel() {
    clearTimeout(carouselTimer);
    const active = getActiveModules();
    if (!active.includes(carouselIdx)) showModule(active[0]);
    else startProgress(DURATIONS[carouselIdx]);
  }

  // ── API ───────────────────────────────────────────
  async function supaFetch(path, opts = {}) {
    const res = await fetch(SUPABASE_URL + path, {
      ...opts,
      headers: {
        'apikey': SUPABASE_ANON,
        'Authorization': 'Bearer ' + SUPABASE_ANON,
        'Content-Type': 'application/json',
        ...(opts.headers || {}),
      },
    });
    if (!res.ok) throw new Error(await res.text());
    return res.json();
  }

  async function loadState() {
    const [overlayRows, players, completions] = await Promise.all([
      supaFetch('/rest/v1/overlay_state?id=eq.1&select=*'),
      supaFetch('/rest/v1/players?select=id,name&order=name'),
      supaFetch('/rest/v1/player_achievements?select=player_id,achievement_id'),
    ]);
    rawPlayers     = players;
    rawCompletions = completions;
    state = overlayRows[0] || defaultState();
    render(state);
  }

  function defaultState() {
    return { layout:'vertical', dungeon:'', hf_data:[], show_leaderboard:true, show_hfs:true, show_pub:false, pub_text:'', season:'S3' };
  }

  // ── REALTIME ──────────────────────────────────────
  function connectRealtime() {
    supa.channel('overlay_state_changes')
      .on('postgres_changes',
        { event: 'UPDATE', schema: 'public', table: 'overlay_state', filter: 'id=eq.1' },
        (payload) => {
          if (!payload.new) return;
          state = payload.new;
          render(state);
        })
      .subscribe((status) => {
        if (status === 'CHANNEL_ERROR') setTimeout(connectRealtime, 3000);
      });
  }

  // ── RENDU ─────────────────────────────────────────
  function render(s) {
    const season = s.season || 'S3';
    const seasonLabel = season === 'S2' ? 'Pré-Saison 2' : season === 'S3' ? 'Pré-Saison 3' : 'Total';
    document.getElementById('ov-season-label').textContent = seasonLabel;

    // Ajuster la hauteur selon les modules actifs
    const overlay = document.getElementById('overlay');
    const modCount = getActiveModulesForState(s).length;
    // Hauteur : header ~70px + dots ~22px + progress 2px + body
    // Body adapté à chaque module
    overlay.style.height = 'auto';

    // Leaderboard
    const top5 = computeScores(rawPlayers || [], rawCompletions || [], season);
    document.getElementById('ov-lb-list').innerHTML = top5.map((p, i) => {
      const rank = i + 1;
      const cls  = rank <= 3 ? 'r' + rank : '';
      const icon = rank === 1 ? '◆' : rank === 2 ? '◇' : rank === 3 ? '◈' : rank + '.';
      return `<div class="ov-lb-entry">
        <span class="ov-lb-rank ${cls}">${icon}</span>
        <span class="ov-lb-name">${esc(p.name)}</span>
        <span class="ov-lb-pts">${p.total}</span>
      </div>`;
    }).join('') || '<div class="empty">Aucun joueur</div>';

    // Message
    document.getElementById('ov-pub-text').textContent = s.pub_text || '';

    // HF
    const hfs = s.hf_data || [];
    document.getElementById('ov-hf-dungeon').textContent = s.dungeon || '';
    document.getElementById('ov-hf-list').innerHTML = hfs.map(hf =>
      `<div class="ov-hf-entry">
        <div class="ov-hf-name">${esc(hf.title)}</div>
        <div class="ov-hf-desc">${esc(hf.desc)}</div>
      </div>`
    ).join('') || '<div class="empty">Aucun haut-fait sélectionné</div>';

    // Masquer les dots des modules inactifs
    const active = getActiveModulesForState(s);
    MODULES.forEach((_, i) => {
      const dot = document.getElementById('dot-' + i);
      if (dot) dot.style.display = active.includes(i) ? '' : 'none';
    });

    restartCarousel();
  }

  function getActiveModulesForState(s) {
    const active = [];
    if (s.show_leaderboard !== false) active.push(0);
    if (s.show_pub && s.pub_text)     active.push(1);
    if (s.show_hfs && (s.hf_data || []).length) active.push(2);
    return active.length ? active : [0];
  }

  function esc(str) {
    return String(str || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  // ── INIT ──────────────────────────────────────────
  buildDots();
  showModule(0);
  loadState().catch(console.error);
  connectRealtime();
</script>
</body>
</html>
