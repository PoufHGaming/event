<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stream Reveal — Stronghold</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link
    href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Crimson+Pro:ital,wght@0,300;0,400;1,300&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --gold: #c9a84c;
      --gold-light: #e8c96a;
      --bg: #0a0a0e;
      --bg2: #12121a;
      --bg3: #1c1c28;
      --border: rgba(201, 168, 76, 0.2);
      --border-bright: rgba(201, 168, 76, 0.5);
      --text: #e8e0d0;
      --text-muted: #706860;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Crimson Pro', Georgia, serif;
      font-weight: 300;
      min-height: 100vh;
      font-size: 16px;
    }

    .layout { display: flex; min-height: 100vh; }

    /* ── Colonne gauche : liste des ouvertures récentes (masquée en mode lien à token) ── */
    .sidebar {
      width: 320px;
      flex-shrink: 0;
      border-right: 1px solid var(--border);
      padding: 20px 14px;
      max-height: 100vh;
      overflow-y: auto;
    }
    .sidebar h2 {
      font-family: 'Cinzel', serif;
      font-size: 16px;
      color: var(--gold);
      letter-spacing: 0.06em;
      text-transform: uppercase;
      margin-bottom: 14px;
      padding: 0 6px;
    }
    .opening-entry {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 10px 12px;
      border-radius: 6px;
      margin-bottom: 6px;
      cursor: pointer;
      border: 1px solid transparent;
      transition: background 0.15s ease, border-color 0.15s ease;
    }
    .opening-entry:hover { background: var(--bg2); }
    .opening-entry.selected { background: var(--bg2); border-color: var(--border-bright); }
    .opening-entry .who { font-size: 15px; display: flex; align-items: center; gap: 5px; }
    .opening-entry .when { font-size: 12px; color: var(--text-muted); }
    .opening-dots { display: flex; gap: 3px; margin-top: 4px; }
    .opening-dot { width: 7px; height: 7px; border-radius: 50%; }
    .sidebar-empty { color: var(--text-muted); font-style: italic; font-size: 14px; padding: 10px; }
    .live-badge { font-size: 11px; color: var(--gold-light); }

    /* ── Zone principale : révélation ── */
    .main {
      flex: 1;
      padding: 30px 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .main-title {
      font-family: 'Cinzel', serif;
      font-size: 22px;
      color: var(--gold-light);
      margin-bottom: 6px;
      text-align: center;
    }
    .main-sub { color: var(--text-muted); font-size: 14px; margin-bottom: 30px; text-align: center; }

    .empty-state { color: var(--text-muted); font-style: italic; margin-top: 80px; text-align: center; }

    .cards-row {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 26px;
    }

    .card-slot { width: 200px; cursor: pointer; transition: transform 0.3s ease; }
    .card-slot:hover { transform: translateY(-4px); }
    .card-slot.locked { cursor: default; }
    .card-slot.locked:hover { transform: none; }

    .card-frame {
      width: 100%;
      aspect-ratio: 707 / 1000;
      border-radius: 8px;
      overflow: hidden;
      background: var(--bg3);
      border: 1px solid var(--border);
      box-shadow: 0 0 var(--glow-blur, 0px) var(--glow-spread, 0px) var(--glow-color, transparent);
      transition: box-shadow 0.4s ease;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .card-frame img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .card-frame .placeholder { font-family: 'Cinzel', serif; font-size: 15px; color: var(--text-muted); text-align: center; padding: 10px; }

    .card-label {
      text-align: center;
      margin-top: 8px;
      font-family: 'Cinzel', serif;
      font-size: 14px;
      color: var(--text-muted);
      letter-spacing: 0.04em;
    }

    @keyframes cardPop {
      0% { transform: scale(0.9); opacity: 0.4; }
      60% { transform: scale(1.03); opacity: 1; }
      100% { transform: scale(1); }
    }
    .card-frame.just-revealed { animation: cardPop 0.5s ease; }
  </style>
</head>

<body>
  <div class="layout">
    <div class="sidebar" id="sidebar">
      <h2>Ouvertures récentes</h2>
      <div id="openings-list"><div class="sidebar-empty">Chargement…</div></div>
    </div>

    <div class="main">
      <div class="main-title" id="main-title">Sélectionne une ouverture</div>
      <div class="main-sub" id="main-sub"></div>
      <div id="reveal-area"><div class="empty-state">Clique sur une ouverture à gauche pour commencer.</div></div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://ehsnzujkmtbzikdbqnjt.supabase.co';
    // Hébergé sur GitHub plutôt que Supabase Storage : image identique appelée en boucle par
    // tout le monde, autant ne pas taper dans le quota Supabase pour ça.
    const CARD_BACK_IMAGE_URL = 'https://raw.githubusercontent.com/PoufHGaming/event/main/stronghold/Dos_Missing.webp';
    const SUPABASE_ANON_KEY = 'sb_publishable_VaKW09b17IXBlU_snJ7S_g_xiwNzyvH';
    const LIST_REFRESH_MS = 6000;   // liste des ouvertures (mode admin uniquement)
    const REVEAL_POLL_MS = 1000;    // détection de nouvelles cartes révélées à distance
    const MAX_POLL_DURATION_MS = 10 * 60 * 1000; // arrêt automatique après 10 min si tout n'a pas été révélé

    // Hébergés dans le bucket card-art — upload ces 3 fichiers avec exactement ces noms.
    const SOUND_EPIC_URL = `${SUPABASE_URL}/storage/v1/object/public/card-art/Sound_Epic.mp3`;
    const SOUND_HEROIC_REGAL_URL = `${SUPABASE_URL}/storage/v1/object/public/card-art/Sound_Heroic_Regal.mp3`;
    const SOUND_LEGENDARY_URL = `${SUPABASE_URL}/storage/v1/object/public/card-art/Sound_Legendary.mp3`;

    const REVEAL_DELAY_MS = {
      UNCOMMON: 0, RARE: 0,
      EPIC: 1000, HEROIC: 1000, REGAL: 1000,
      LEGENDARY: 3000,
    };

    async function sbFetch(path) {
      const res = await fetch(SUPABASE_URL + path, {
        headers: { apikey: SUPABASE_ANON_KEY, Authorization: 'Bearer ' + SUPABASE_ANON_KEY },
        cache: 'no-store', // évite qu'une ancienne réponse (ex: vide) reste servie depuis le cache du navigateur
      });
      if (!res.ok) throw new Error(await res.text());
      return res.json();
    }

    async function sbPatch(path, body) {
      const res = await fetch(SUPABASE_URL + path, {
        method: 'PATCH',
        headers: {
          apikey: SUPABASE_ANON_KEY,
          Authorization: 'Bearer ' + SUPABASE_ANON_KEY,
          'Content-Type': 'application/json',
          Prefer: 'return=minimal',
        },
        body: JSON.stringify(body),
      });
      if (!res.ok) throw new Error(await res.text());
    }

    const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

    function pick(jsonField, fallback) {
      if (!jsonField) return fallback || '';
      return jsonField.fr || Object.values(jsonField)[0] || fallback || '';
    }

    function hexToRgba(hex, alpha) {
      const h = (hex || '999999').replace('#', '');
      const r = parseInt(h.substring(0, 2), 16);
      const g = parseInt(h.substring(2, 4), 16);
      const b = parseInt(h.substring(4, 6), 16);
      return `rgba(${r}, ${g}, ${b}, ${alpha})`;
    }

    function esc(s) {
      return String(s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    let raritiesByCode = {};
    let cardsById = new Map();
    let usernameById = new Map();
    let selectedOpeningId = null;
    let openings = [];

    // ── État de l'ouverture actuellement chargée (partagé entre les deux modes) ──
    let currentOpeningId = null;
    let currentOpeningCards = [];
    let alreadyShownIndices = new Set();
    let isInteractive = true;
    let pollTimer = null;
    let pollStartTime = null;

    async function loadReferenceData() {
      const [rarities, cards] = await Promise.all([
        sbFetch('/rest/v1/tcg_rarities?select=code,color_hex,sort_order'),
        sbFetch('/rest/v1/tcg_cards?select=id,name,image_url,rarity'),
      ]);
      raritiesByCode = Object.fromEntries(rarities.map(r => [r.code, r]));
      cardsById = new Map(cards.map(c => [c.id, c]));
      console.log(`[diagnostic] ${cards.length} carte(s) chargée(s) dans cardsById`);
    }

    // ============================================================
    // MODE ADMIN : liste des ouvertures récentes, sélection manuelle
    // ============================================================

    async function loadOpenings() {
      try {
        const [rows, users] = await Promise.all([
          sbFetch('/rest/v1/tcg_booster_openings?select=id,user_id,cards_obtained,opened_at,reveal_token,revealed_indices&order=opened_at.desc&limit=30'),
          sbFetch('/rest/v1/tcg_users?select=id,username'),
        ]);
        usernameById = new Map(users.map(u => [u.id, u.username || '???']));
        openings = rows;
        renderOpeningsList();
      } catch (e) {
        document.getElementById('openings-list').innerHTML = `<div class="sidebar-empty">Erreur : ${esc(e.message)}</div>`;
      }
    }

    function renderOpeningsList() {
      const el = document.getElementById('openings-list');
      if (!openings.length) {
        el.innerHTML = '<div class="sidebar-empty">Aucune ouverture récente.</div>';
        return;
      }
      el.innerHTML = openings.map(o => {
        const username = usernameById.get(o.user_id) || '???';
        const time = new Date(o.opened_at).toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
        const dots = (o.cards_obtained || []).map(c => {
          const color = raritiesByCode[c.rarity]?.color_hex || '#706860';
          return `<span class="opening-dot" style="background:${color}"></span>`;
        }).join('');
        const liveBadge = o.reveal_token ? '<span class="live-badge" title="Lien de reveal en direct actif">🔴</span>' : '';
        return `<div class="opening-entry ${o.id === selectedOpeningId ? 'selected' : ''}" onclick="selectOpening('${o.id}')">
          <div>
            <div class="who">${liveBadge}${esc(username)}</div>
            <div class="opening-dots">${dots}</div>
          </div>
          <div class="when">${time}</div>
        </div>`;
      }).join('');
    }

    function selectOpening(openingId) {
      selectedOpeningId = openingId;
      const opening = openings.find(o => o.id === openingId);
      renderOpeningsList();
      if (!opening) return;

      const username = usernameById.get(opening.user_id) || '???';
      const hasToken = !!opening.reveal_token;

      loadOpeningCommon({
        id: opening.id,
        cards: opening.cards_obtained || [],
        alreadyRevealed: opening.revealed_indices || [],
        title: `Ouverture de ${username}`,
        subtitle: new Date(opening.opened_at).toLocaleTimeString('fr-FR')
          + (hasToken ? ' — 🔴 en direct, lien détenu par le joueur (lecture seule ici)' : ''),
        interactive: !hasToken, // une ouverture "live" (avec token) ne se clique que depuis le lien du joueur
      });
    }

    // ============================================================
    // MODE JOUEUR : chargement direct via ?token=... dans l'URL
    // ============================================================

    function getUrlToken() {
      return new URLSearchParams(window.location.search).get('token');
    }

    async function loadOpeningByToken(token) {
      document.getElementById('sidebar').style.display = 'none'; // pas de liste, pas de spoil
      try {
        const rows = await sbFetch(
          `/rest/v1/tcg_booster_openings?select=id,cards_obtained,revealed_indices&reveal_token=eq.${encodeURIComponent(token)}`
        );
        const opening = rows[0];
        if (!opening) {
          document.getElementById('main-title').textContent = 'Lien introuvable';
          document.getElementById('reveal-area').innerHTML = '<div class="empty-state">Ce lien est invalide ou a expiré.</div>';
          return;
        }
        loadOpeningCommon({
          id: opening.id,
          cards: opening.cards_obtained || [],
          alreadyRevealed: opening.revealed_indices || [],
          title: 'Ton booster est prêt !',
          subtitle: 'Clique sur une carte pour la révéler',
          interactive: true,
        });
      } catch (e) {
        document.getElementById('reveal-area').innerHTML = `<div class="empty-state">Erreur : ${esc(e.message)}</div>`;
      }
    }

    // ============================================================
    // Logique commune : affichage, révélation, sondage
    // ============================================================

    function loadOpeningCommon({ id, cards, alreadyRevealed, title, subtitle, interactive }) {
      if (pollTimer) clearInterval(pollTimer);

      currentOpeningId = id;
      currentOpeningCards = cards;
      alreadyShownIndices = new Set();
      isInteractive = interactive;

      document.getElementById('main-title').textContent = title;
      document.getElementById('main-sub').textContent = subtitle || '';

      const area = document.getElementById('reveal-area');
      area.innerHTML = `<div class="cards-row">` + cards.map((c, i) => `
        <div class="card-slot ${interactive ? '' : 'locked'}" id="slot-${i}" ${interactive ? `onclick="revealCard(${i}, true)"` : ''}>
          <div class="card-frame" id="frame-${i}"><img src="${CARD_BACK_IMAGE_URL}" alt="Dos de carte"></div>
          <div class="card-label">Carte ${i + 1}</div>
        </div>
      `).join('') + `</div>`;

      // Affiche instantanément (sans animation) ce qui était déjà révélé avant ce chargement —
      // ex: le joueur a rechargé sa page, ou l'admin ouvre le lien en cours de route.
      for (const idx of (alreadyRevealed || [])) {
        alreadyShownIndices.add(idx);
        renderCardStatic(idx);
      }

      // Si tout était déjà révélé avant même ce chargement, inutile de sonder quoi que ce soit.
      if (alreadyShownIndices.size >= cards.length) return;

      pollStartTime = Date.now();
      pollTimer = setInterval(pollForNewReveals, REVEAL_POLL_MS);
    }

    async function pollForNewReveals() {
      if (!currentOpeningId) return;

      // Filet de sécurité : un onglet oublié, resté ouvert sans que tout ait été révélé, arrête
      // de consommer des requêtes après 10 min — au-delà, plus aucun intérêt à continuer à sonder.
      if (Date.now() - pollStartTime > MAX_POLL_DURATION_MS) {
        clearInterval(pollTimer);
        pollTimer = null;
        return;
      }

      try {
        const rows = await sbFetch(`/rest/v1/tcg_booster_openings?select=revealed_indices&id=eq.${currentOpeningId}`);
        const remote = rows[0]?.revealed_indices || [];
        for (const idx of remote) {
          if (!alreadyShownIndices.has(idx)) {
            revealCard(idx, false); // détecté à distance : on rejoue l'animation, mais on ne réécrit pas
          }
        }
        // Tout est désormais connu : plus rien ne peut changer, inutile de continuer à sonder.
        if (alreadyShownIndices.size >= currentOpeningCards.length) {
          clearInterval(pollTimer);
          pollTimer = null;
        }
      } catch (e) {
        console.error('Erreur de sondage :', e);
      }
    }

    function renderCardStatic(index) {
      const entry = currentOpeningCards[index];
      const frame = document.getElementById(`frame-${index}`);
      const slot = document.getElementById(`slot-${index}`);
      if (!entry || !frame || !slot) return;
      slot.classList.add('done');
      const card = cardsById.get(entry.card_id);
      if (!card) console.warn(`[diagnostic] Carte introuvable pour card_id="${entry.card_id}" (index ${index})`);
      const imgUrl = pick(card?.image_url, '');
      if (card && !imgUrl) console.warn(`[diagnostic] Carte trouvée mais image_url vide/invalide :`, card);
      const name = pick(card?.name, '');
      frame.innerHTML = `<img src="${imgUrl}" alt="${esc(name)}">`;
      const label = slot.querySelector('.card-label');
      if (label) label.textContent = name || `Carte ${index + 1}`;
    }

    /**
     * @param {number} index
     * @param {boolean} persist - true si ce clic vient de CET onglet (écrit en base pour que les
     *   autres onglets le détectent) ; false si on rejoue juste une révélation détectée à distance.
     */
    async function revealCard(index, persist) {
      const entry = currentOpeningCards[index];
      if (!entry) return;
      if (alreadyShownIndices.has(index)) return; // déjà montrée ici, ignore (re-clic ou écho du sondage)
      alreadyShownIndices.add(index); // marqué tout de suite, avant même l'animation

      if (persist) {
        persistRevealedIndex(currentOpeningId, index); // dès le clic, pour que les autres onglets démarrent au plus tôt
      }

      const slot = document.getElementById(`slot-${index}`);
      const frame = document.getElementById(`frame-${index}`);
      if (!slot || !frame) return;
      slot.classList.add('done');

      const rarity = entry.rarity;
      const rarityInfo = raritiesByCode[rarity];
      const delay = REVEAL_DELAY_MS[rarity] ?? 0;

      if (rarityInfo) {
        const order = rarityInfo.sort_order || 1;
        frame.style.setProperty('--glow-color', hexToRgba(rarityInfo.color_hex, 0.6));
        frame.style.setProperty('--glow-blur', `${10 + order * 6}px`);
        frame.style.setProperty('--glow-spread', `${order}px`);
      }

      const soundByRarity = {
        EPIC: SOUND_EPIC_URL,
        HEROIC: SOUND_HEROIC_REGAL_URL,
        REGAL: SOUND_HEROIC_REGAL_URL,
        LEGENDARY: SOUND_LEGENDARY_URL,
      };
      const soundUrl = soundByRarity[rarity] || '';
      if (soundUrl) {
        try { new Audio(soundUrl).play().catch(() => {}); } catch (e) { /* silencieux si ça échoue */ }
      }

      if (delay > 0) await sleep(delay);

      const card = cardsById.get(entry.card_id);
      if (!card) console.warn(`[diagnostic] Carte introuvable pour card_id="${entry.card_id}" (index ${index})`);
      const imgUrl = pick(card?.image_url, '');
      if (card && !imgUrl) console.warn(`[diagnostic] Carte trouvée mais image_url vide/invalide :`, card);
      const name = pick(card?.name, '');
      frame.innerHTML = `<img src="${imgUrl}" alt="${esc(name)}">`;
      frame.classList.add('just-revealed');
      const label = slot.querySelector('.card-label');
      if (label) label.textContent = name || `Carte ${index + 1}`;
    }

    async function persistRevealedIndex(openingId, index) {
      try {
        const rows = await sbFetch(`/rest/v1/tcg_booster_openings?select=revealed_indices&id=eq.${openingId}`);
        const current = rows[0]?.revealed_indices || [];
        if (current.includes(index)) return;
        await sbPatch(`/rest/v1/tcg_booster_openings?id=eq.${openingId}`, {
          revealed_indices: [...current, index],
        });
      } catch (e) {
        console.error('Erreur de sauvegarde du reveal :', e);
      }
    }

    // ============================================================
    // Démarrage
    // ============================================================

    (async () => {
      try {
        await loadReferenceData();
      } catch (e) {
        document.getElementById('reveal-area').innerHTML = `<div class="empty-state">Erreur : ${esc(e.message)}</div>`;
        return;
      }

      const token = getUrlToken();
      if (token) {
        await loadOpeningByToken(token);
      } else {
        loadOpenings();
        setInterval(loadOpenings, LIST_REFRESH_MS);
      }
    })();
  </script>
</body>

</html>
