<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The STRONGHOLD — Soirée d'ouverture</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link
    href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Crimson+Pro:ital,wght@0,300;0,400;1,300&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --gold: #c9a84c;
      --gold-light: #e8c96a;
      --bg: #0a0a0e;
      --bg2: #12121a;
      --bg3: #1c1c28;
      --border: rgba(201, 168, 76, 0.2);
      --text: #e8e0d0;
      --text-muted: #706860;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Crimson Pro', Georgia, serif;
      font-weight: 300;
      min-height: 100vh;
      font-size: 17px;
    }

    header {
      text-align: center;
      padding: 36px 24px 24px;
      border-bottom: 1px solid var(--border);
      position: relative;
    }
    header::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; height: 2px;
      background: linear-gradient(90deg, transparent, var(--gold), transparent);
    }

    .page-title {
      font-family: 'Cinzel', serif;
      font-size: clamp(22px, 4vw, 34px);
      font-weight: 700;
      color: var(--gold);
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .toolbar {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin: 20px auto 0;
      font-family: 'Cinzel', serif;
      font-size: 14px;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: var(--text-muted);
    }
    .toolbar select {
      background: var(--bg2);
      color: var(--gold-light);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 7px 12px;
      font-family: 'Crimson Pro', serif;
      font-size: 15px;
      text-transform: none;
      letter-spacing: normal;
      cursor: pointer;
    }

    .progress-line {
      text-align: center;
      margin: 18px auto 0;
      font-family: 'Cinzel', serif;
      font-size: clamp(20px, 3vw, 30px);
      color: var(--gold-light);
      letter-spacing: 0.04em;
    }
    .progress-line span { color: var(--text); opacity: 0.5; font-size: 0.7em; }

    .grid {
      max-width: 1300px;
      margin: 32px auto 60px;
      padding: 0 24px;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 22px;
    }

    .tile {
      width: 160px;
      flex: 0 0 auto;
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: 6px;
      overflow: hidden;
      transition: transform 0.4s ease, opacity 0.4s ease;
      box-shadow: 0 0 var(--glow-blur, 0px) var(--glow-spread, 0px) var(--glow-color, transparent);
    }
    .tile.hidden-card { opacity: 0.75; }
    .tile.just-revealed { animation: pop 0.6s ease; }
    .tile.clickable { cursor: pointer; }
    .tile.clickable:hover { transform: translateY(-3px); border-color: var(--gold); }
    @keyframes pop {
      0% { transform: scale(0.85); opacity: 0; }
      60% { transform: scale(1.04); opacity: 1; }
      100% { transform: scale(1); }
    }

    .art {
      width: 100%;
      aspect-ratio: 707 / 1000;
      overflow: hidden;
      background: var(--bg3);
    }
    .art img { width: 100%; height: 100%; object-fit: cover; display: block; }

    .name {
      padding: 8px 10px;
      font-size: 14px;
      color: var(--text);
      text-align: center;
    }
    .hidden-card .name { color: var(--text-muted); font-style: italic; }

    .empty-state { text-align: center; color: var(--text-muted); padding: 60px 24px; }

    /* Fenêtre "qui possède cette carte" */
    .modal-overlay {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.75);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 100;
      padding: 20px;
    }
    .modal-overlay.open { display: flex; }
    .modal-box {
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 28px;
      max-width: 340px;
      width: 100%;
      text-align: center;
    }
    .modal-title {
      font-family: 'Cinzel', serif;
      color: var(--gold-light);
      font-size: 20px;
      margin-bottom: 16px;
    }
    .modal-owners { margin-bottom: 20px; max-height: 240px; overflow-y: auto; }
    .modal-owners div { padding: 5px 0; font-size: 16px; }
    .modal-close-btn {
      background: var(--bg3); color: var(--text); border: 1px solid var(--border);
      padding: 8px 22px; border-radius: 4px; cursor: pointer;
      font-family: 'Crimson Pro', serif; font-size: 15px;
    }
    .modal-close-btn:hover { border-color: var(--gold); }
  </style>
</head>

<body>
  <header>
    <div class="page-title">Soirée d'ouverture — Fellowship TCG</div>
  </header>

  <div class="toolbar">
    <label for="user-filter">Voir :</label>
    <select id="user-filter">
      <option value="">Tous (ALL)</option>
    </select>
  </div>

  <div class="progress-line" id="progress-line">Chargement…</div>

  <div class="grid" id="grid"></div>

  <div class="modal-overlay" id="owners-modal">
    <div class="modal-box">
      <div class="modal-title" id="modal-card-name"></div>
      <div class="modal-owners" id="modal-owners-list"></div>
      <button class="modal-close-btn" onclick="closeOwnersModal()">Fermer</button>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://ehsnzujkmtbzikdbqnjt.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_VaKW09b17IXBlU_snJ7S_g_xiwNzyvH';
    const REFRESH_MS = 8000;

    async function sbFetch(path) {
      const res = await fetch(SUPABASE_URL + path, {
        headers: { apikey: SUPABASE_ANON_KEY, Authorization: 'Bearer ' + SUPABASE_ANON_KEY },
      });
      if (!res.ok) throw new Error(await res.text());
      return res.json();
    }

    function pick(jsonField, fallback) {
      if (!jsonField) return fallback || '';
      return jsonField.fr || Object.values(jsonField)[0] || fallback || '';
    }

    function hexToRgba(hex, alpha) {
      const h = hex.replace('#', '');
      const r = parseInt(h.substring(0, 2), 16);
      const g = parseInt(h.substring(2, 4), 16);
      const b = parseInt(h.substring(4, 6), 16);
      return `rgba(${r}, ${g}, ${b}, ${alpha})`;
    }

    let previouslyRevealedIds = new Set();
    let raritiesByCode = {};
    let allCards = [];
    let ownersByCardId = new Map();   // card_id -> [usernames...]  (mode "Tous")
    let cardIdsByUsername = new Map(); // username -> Set(card_id)  (mode utilisateur précis)
    let cardsById = new Map();
    let knownUsernames = [];

    function currentFilter() {
      return document.getElementById('user-filter').value; // '' = Tous
    }

    function isRevealed(card) {
      const filter = currentFilter();
      if (!filter) return ownersByCardId.has(card.id);
      return cardIdsByUsername.get(filter)?.has(card.id) || false;
    }

    async function load() {
      let cards, rarities, collections, users;
      try {
        [cards, rarities, collections, users] = await Promise.all([
          sbFetch('/rest/v1/tcg_cards?select=id,code,name,image_url,rarity&is_active=eq.true'),
          sbFetch('/rest/v1/tcg_rarities?select=code,color_hex,sort_order'),
          sbFetch('/rest/v1/tcg_user_collections?select=user_id,card_id,quantity&quantity=gt.0'),
          sbFetch('/rest/v1/tcg_users?select=id,username'),
        ]);
      } catch (e) {
        document.getElementById('grid').innerHTML = `<div class="empty-state">Erreur de chargement : ${e.message}</div>`;
        return;
      }

      raritiesByCode = Object.fromEntries(rarities.map(r => [r.code, r]));
      cardsById = new Map(cards.map(c => [c.id, c]));

      const usernameById = new Map(users.map(u => [u.id, u.username || 'Inconnu']));

      ownersByCardId = new Map();
      cardIdsByUsername = new Map();
      const usernamesSet = new Set();

      for (const row of collections) {
        const username = usernameById.get(row.user_id) || 'Inconnu';
        usernamesSet.add(username);

        if (!ownersByCardId.has(row.card_id)) ownersByCardId.set(row.card_id, []);
        ownersByCardId.get(row.card_id).push(username);

        if (!cardIdsByUsername.has(username)) cardIdsByUsername.set(username, new Set());
        cardIdsByUsername.get(username).add(row.card_id);
      }

      allCards = cards.sort((a, b) => {
        const orderA = raritiesByCode[a.rarity]?.sort_order ?? 0;
        const orderB = raritiesByCode[b.rarity]?.sort_order ?? 0;
        if (orderB !== orderA) return orderB - orderA;
        return pick(a.name, a.code).localeCompare(pick(b.name, b.code));
      });

      // Repeuple le sélecteur uniquement si la liste de noms a changé, pour ne pas perdre la
      // sélection en cours du joueur à chaque rafraîchissement automatique.
      const sortedUsernames = [...usernamesSet].sort();
      if (JSON.stringify(sortedUsernames) !== JSON.stringify(knownUsernames)) {
        knownUsernames = sortedUsernames;
        const select = document.getElementById('user-filter');
        const currentValue = select.value;
        select.innerHTML = '<option value="">Tous (ALL)</option>' +
          knownUsernames.map(u => `<option value="${escAttr(u)}">${esc(u)}</option>`).join('');
        select.value = knownUsernames.includes(currentValue) ? currentValue : '';
      }

      render();
    }

    function render() {
      const filter = currentFilter();
      const revealedCount = allCards.filter(isRevealed).length;
      const label = filter ? `cartes obtenues par ${filter}` : 'cartes obtenues par la communauté';
      document.getElementById('progress-line').innerHTML =
        `${revealedCount}<span> / ${allCards.length} ${label}</span>`;

      const grid = document.getElementById('grid');
      if (!allCards.length) {
        grid.innerHTML = '<div class="empty-state">Aucune carte à afficher.</div>';
        return;
      }

      grid.innerHTML = allCards.map(c => {
        const rarity = raritiesByCode[c.rarity];
        const order = rarity?.sort_order ?? 1;
        const glowStyle = rarity
          ? `--glow-color:${hexToRgba(rarity.color_hex, 0.55)}; --glow-blur:${8 + order * 6}px; --glow-spread:${order}px;`
          : '';

        const revealed = isRevealed(c);
        const isNew = revealed && !previouslyRevealedIds.has(c.id);
        // Le clic pour voir les possesseurs n'a de sens qu'en mode "Tous" (en mode utilisateur
        // précis, on sait déjà qui l'a : c'est la personne sélectionnée).
        const clickable = revealed && !currentFilter();

        if (!revealed) {
          return `<div class="tile hidden-card" style="${glowStyle}">
            <div class="art"><div style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-family:'Cinzel',serif;font-size:48px;color:var(--border);">?</div></div>
            <div class="name">???</div>
          </div>`;
        }
        const imgUrl = pick(c.image_url, '');
        const name = pick(c.name, c.code);
        return `<div class="tile ${isNew ? 'just-revealed' : ''} ${clickable ? 'clickable' : ''}" style="${glowStyle}" ${clickable ? `onclick="showOwners('${c.id}')"` : ''}>
          <div class="art"><img src="${imgUrl}" alt="${name}" loading="lazy"></div>
          <div class="name">${name}</div>
        </div>`;
      }).join('');

      previouslyRevealedIds = new Set(allCards.filter(isRevealed).map(c => c.id));
    }

    function showOwners(cardId) {
      const card = cardsById.get(cardId);
      const owners = ownersByCardId.get(cardId) || [];
      document.getElementById('modal-card-name').textContent = pick(card?.name, card?.code || '');
      document.getElementById('modal-owners-list').innerHTML = owners.length
        ? owners.map(o => `<div>🎴 ${esc(o)}</div>`).join('')
        : '<div style="color:var(--text-muted); font-style:italic;">Personne pour l\'instant</div>';
      document.getElementById('owners-modal').classList.add('open');
    }

    function closeOwnersModal() {
      document.getElementById('owners-modal').classList.remove('open');
    }

    function esc(s) {
      return String(s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }
    function escAttr(s) {
      return esc(s).replace(/"/g, '&quot;');
    }

    document.getElementById('user-filter').addEventListener('change', () => {
      previouslyRevealedIds = new Set(); // évite un flash d'animation "just-revealed" en changeant de vue
      render();
    });

    load();
    setInterval(load, REFRESH_MS);
  </script>
</body>

</html>
