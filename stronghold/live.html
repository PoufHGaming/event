<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Stronghold — Fellowship TCG</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link
    href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Crimson+Pro:ital,wght@0,300;0,400;1,300&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --gold: #c9a84c;
      --gold-light: #e8c96a;
      --bg: #0a0a0e;
      --bg2: #12121a;
      --bg3: #1c1c28;
      --border: rgba(201, 168, 76, 0.2);
      --border-bright: rgba(201, 168, 76, 0.5);
      --text: #e8e0d0;
      --text-muted: #706860;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Crimson Pro', Georgia, serif;
      font-weight: 300;
      min-height: 100vh;
      font-size: 17px;
    }

    /* ── Barre unique : accueil + filtres + langue — collante au scroll ── */
    .sticky-bar {
      position: sticky;
      top: 0;
      z-index: 50;
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 10px 20px;
      background: var(--bg);
      border-bottom: 1px solid var(--border);
    }
    .home-btn {
      display: inline-flex;
      align-items: center;
      color: var(--text-muted);
      text-decoration: none;
      padding: 7px 10px;
      border-radius: 4px;
      transition: color 0.2s ease, background 0.2s ease;
      flex-shrink: 0;
    }
    .home-btn:hover { color: var(--gold-light); background: var(--bg2); }

    .filters {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 0 auto; /* centre ce bloc entre l'icône accueil et la langue */
      font-family: 'Cinzel', serif;
      font-size: 13px;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: var(--text-muted);
    }
    .filters select {
      background: var(--bg2);
      color: var(--gold-light);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 6px 10px;
      font-family: 'Crimson Pro', serif;
      font-size: 14px;
      text-transform: none;
      letter-spacing: normal;
      cursor: pointer;
    }

    .lang-toggle { display: flex; gap: 2px; flex-shrink: 0; }
    .lang-btn {
      font-family: 'Cinzel', serif;
      font-size: 12px;
      letter-spacing: 0.1em;
      padding: 7px 14px;
      background: none;
      border: 1px solid var(--border);
      color: var(--text-muted);
      cursor: pointer;
    }
    .lang-btn:first-child { border-radius: 3px 0 0 3px; }
    .lang-btn:last-child { border-radius: 0 3px 3px 0; }
    .lang-btn.active { color: var(--gold-light); border-color: var(--border-bright); background: rgba(201,168,76,0.1); font-weight: 600; }

    /* ── En-tête : logo seul, espacement resserré au maximum ── */
    header {
      text-align: center;
      padding: 6px 24px 0;
    }

    .site-logo {
      display: block;
      max-width: 300px;
      width: 55%;
      height: auto;
      margin: 0 auto;
      filter: drop-shadow(0 6px 18px rgba(0,0,0,0.65));
    }

    .tagline {
      margin-top: 0;
      font-size: 15px;
      font-style: italic;
      color: var(--text-muted);
      letter-spacing: 0.03em;
    }


    .progress-line {
      text-align: center;
      margin: 18px auto 0;
      font-family: 'Cinzel', serif;
      font-size: clamp(20px, 3vw, 30px);
      color: var(--gold-light);
      letter-spacing: 0.04em;
    }
    .progress-line span { color: var(--text); opacity: 0.5; font-size: 0.7em; }

    .grid {
      max-width: 1300px;
      margin: 32px auto 60px;
      padding: 0 24px;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 22px;
    }

    .tile {
      width: 160px;
      flex: 0 0 auto;
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: 6px;
      overflow: hidden;
      transition: transform 0.4s ease, opacity 0.4s ease;
      box-shadow: 0 0 var(--glow-blur, 0px) var(--glow-spread, 0px) var(--glow-color, transparent);
    }
    .tile.hidden-card { opacity: 0.75; }
    .tile.just-revealed { animation: pop 0.6s ease; }
    .tile.clickable { cursor: pointer; }
    .tile.clickable:hover { transform: translateY(-3px); border-color: var(--gold); }
    @keyframes pop {
      0% { transform: scale(0.85); opacity: 0; }
      60% { transform: scale(1.04); opacity: 1; }
      100% { transform: scale(1); }
    }

    .art {
      width: 100%;
      aspect-ratio: 707 / 1000;
      overflow: hidden;
      background: var(--bg3);
    }
    .art img { width: 100%; height: 100%; object-fit: cover; display: block; }

    .name {
      padding: 8px 10px;
      font-size: 14px;
      color: var(--text);
      text-align: center;
    }
    .hidden-card .name { color: var(--text-muted); font-style: italic; }

    .quantity {
      font-family: 'Cinzel', serif;
      font-size: 13px;
      color: var(--gold-light);
      text-align: center;
      padding: 0 10px 8px;
      opacity: 0.85;
    }

    .empty-state { text-align: center; color: var(--text-muted); padding: 60px 24px; }

    /* Fenêtre "qui possède cette carte" */
    .modal-overlay {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.75);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 100;
      padding: 20px;
    }
    .modal-overlay.open { display: flex; }
    .modal-box {
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 28px;
      max-width: 340px;
      width: 100%;
      text-align: center;
    }
    .modal-title {
      font-family: 'Cinzel', serif;
      color: var(--gold-light);
      font-size: 20px;
      margin-bottom: 16px;
    }
    .modal-owners { margin-bottom: 20px; max-height: 240px; overflow-y: auto; }
    .modal-owners div { padding: 5px 0; font-size: 16px; }
    .modal-close-btn {
      background: var(--bg3); color: var(--text); border: 1px solid var(--border);
      padding: 8px 22px; border-radius: 4px; cursor: pointer;
      font-family: 'Crimson Pro', serif; font-size: 15px;
    }
    .modal-close-btn:hover { border-color: var(--gold); }
  </style>
</head>

<body>
  <header>
    <img src="../images/event/strongholdlogo.png" alt="The Stronghold" class="site-logo">
    <div class="tagline" id="tagline"></div>
  </header>

  <!-- Chemin relatif : suppose que live.html est hébergé dans le même dossier que index.html.
       Ajuste en "../index.html" ou le chemin qui convient si ta structure de dossiers diffère. -->
  <div class="sticky-bar">
    <a href="index.html" class="home-btn" title="Accueil">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
    </a>
    <div class="filters">
      <label for="user-filter" id="label-view">Voir :</label>
      <select id="user-filter">
        <option value="" id="option-all-users">Tous (ALL)</option>
      </select>
      <select id="status-filter">
        <option value="" id="option-status-all">Toutes</option>
        <option value="obtained" id="option-status-obtained">Obtenues</option>
        <option value="missing" id="option-status-missing">Manquantes</option>
      </select>
    </div>
    <div class="lang-toggle">
      <button class="lang-btn active" id="lang-btn-fr" onclick="setLang('fr')">FR</button>
      <button class="lang-btn" id="lang-btn-en" onclick="setLang('en')">EN</button>
    </div>
  </div>

  <div class="progress-line" id="progress-line">Chargement…</div>

  <div class="grid" id="grid"></div>

  <div class="modal-overlay" id="owners-modal">
    <div class="modal-box">
      <div class="modal-title" id="modal-card-name"></div>
      <div class="modal-owners" id="modal-owners-list"></div>
      <button class="modal-close-btn" id="modal-close-btn" onclick="closeOwnersModal()">Fermer</button>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://ehsnzujkmtbzikdbqnjt.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_VaKW09b17IXBlU_snJ7S_g_xiwNzyvH';
    const REFRESH_MS = 8000;

    const I18N = {
      fr: {
        tagline: 'Un TCG Fellowship créé par Pouf_HGaming',
        viewLabel: 'Voir :',
        allUsers: 'Tous (ALL)',
        statusAll: 'Toutes',
        statusObtained: 'Obtenues',
        statusMissing: 'Manquantes',
        loading: 'Chargement…',
        progressCommunity: (n, total) => `${n} / ${total} cartes obtenues par la communauté`,
        progressUser: (n, total, name) => `${n} / ${total} cartes obtenues par ${name}`,
        emptyNoCards: 'Aucune carte à afficher.',
        emptyNoMatch: 'Aucune carte ne correspond à ce filtre.',
        errorLoading: (msg) => `Erreur de chargement : ${msg}`,
        noOwnersYet: 'Personne pour l\'instant',
        unknownUser: 'Inconnu',
        close: 'Fermer',
      },
      en: {
        tagline: 'A Fellowship TCG created by Pouf_HGaming',
        viewLabel: 'View:',
        allUsers: 'All',
        statusAll: 'All',
        statusObtained: 'Obtained',
        statusMissing: 'Missing',
        loading: 'Loading…',
        progressCommunity: (n, total) => `${n} / ${total} cards obtained by the community`,
        progressUser: (n, total, name) => `${n} / ${total} cards obtained by ${name}`,
        emptyNoCards: 'No cards to display.',
        emptyNoMatch: 'No cards match this filter.',
        errorLoading: (msg) => `Error loading: ${msg}`,
        noOwnersYet: 'No one yet',
        unknownUser: 'Unknown',
        close: 'Close',
      },
    };

    let currentLang = 'fr';

    /** Ne plante jamais si l'élément n'existe pas (encore) — se contente de ne rien faire. */
    function setText(id, value) {
      const el = document.getElementById(id);
      if (el) el.textContent = value;
    }

    function setLang(lang) {
      currentLang = lang;
      document.documentElement.lang = lang;
      document.getElementById('lang-btn-fr')?.classList.toggle('active', lang === 'fr');
      document.getElementById('lang-btn-en')?.classList.toggle('active', lang === 'en');

      const t = I18N[lang];
      setText('tagline', t.tagline);
      setText('label-view', t.viewLabel);
      setText('option-all-users', t.allUsers);
      setText('option-status-all', t.statusAll);
      setText('option-status-obtained', t.statusObtained);
      setText('option-status-missing', t.statusMissing);
      setText('modal-close-btn', t.close);

      render(); // les noms de cartes et les libellés du compteur suivent aussi la langue
    }

    async function sbFetch(path) {
      const res = await fetch(SUPABASE_URL + path, {
        headers: { apikey: SUPABASE_ANON_KEY, Authorization: 'Bearer ' + SUPABASE_ANON_KEY },
      });
      if (!res.ok) throw new Error(await res.text());
      return res.json();
    }

    function pick(jsonField, fallback) {
      if (!jsonField) return fallback || '';
      return jsonField[currentLang] || jsonField.fr || Object.values(jsonField)[0] || fallback || '';
    }

    function hexToRgba(hex, alpha) {
      const h = hex.replace('#', '');
      const r = parseInt(h.substring(0, 2), 16);
      const g = parseInt(h.substring(2, 4), 16);
      const b = parseInt(h.substring(4, 6), 16);
      return `rgba(${r}, ${g}, ${b}, ${alpha})`;
    }

    let previouslyRevealedIds = new Set();
    let raritiesByCode = {};
    let allCards = [];
    let ownersByCardId = new Map();
    let cardIdsByUsername = new Map();
    let cardsById = new Map();
    let knownUsernames = [];

    function currentFilter() {
      return document.getElementById('user-filter').value;
    }

    function isRevealed(card) {
      const filter = currentFilter();
      if (!filter) return ownersByCardId.has(card.id);
      return cardIdsByUsername.get(filter)?.has(card.id) || false;
    }

    /** En mode "Tous" : total cumulé de tous les possesseurs. En mode utilisateur précis :
     * uniquement le nombre d'exemplaires que CETTE personne possède. */
    function getDisplayQuantity(card) {
      const filter = currentFilter();
      if (!filter) {
        const owners = ownersByCardId.get(card.id) || [];
        return owners.reduce((sum, o) => sum + o.quantity, 0);
      }
      return cardIdsByUsername.get(filter)?.get(card.id) || 0;
    }

    async function load() {
      let cards, rarities, collections, users;
      try {
        [cards, rarities, collections, users] = await Promise.all([
          sbFetch('/rest/v1/tcg_cards?select=id,code,name,image_url,rarity&is_active=eq.true'),
          sbFetch('/rest/v1/tcg_rarities?select=code,color_hex,sort_order'),
          sbFetch('/rest/v1/tcg_user_collections?select=user_id,card_id,quantity&quantity=gt.0'),
          sbFetch('/rest/v1/tcg_users?select=id,username'),
        ]);
      } catch (e) {
        document.getElementById('grid').innerHTML = `<div class="empty-state">${I18N[currentLang].errorLoading(e.message)}</div>`;
        return;
      }

      raritiesByCode = Object.fromEntries(rarities.map(r => [r.code, r]));
      cardsById = new Map(cards.map(c => [c.id, c]));

      const unknownLabel = I18N[currentLang].unknownUser;
      const usernameById = new Map(users.map(u => [u.id, u.username || unknownLabel]));

      ownersByCardId = new Map();   // card_id -> [{username, quantity}, ...]
      cardIdsByUsername = new Map(); // username -> Map(card_id -> quantity)
      const usernamesSet = new Set();

      for (const row of collections) {
        const username = usernameById.get(row.user_id) || unknownLabel;
        usernamesSet.add(username);

        if (!ownersByCardId.has(row.card_id)) ownersByCardId.set(row.card_id, []);
        ownersByCardId.get(row.card_id).push({ username, quantity: row.quantity });

        if (!cardIdsByUsername.has(username)) cardIdsByUsername.set(username, new Map());
        cardIdsByUsername.get(username).set(row.card_id, row.quantity);
      }

      allCards = cards.sort((a, b) => {
        const orderA = raritiesByCode[a.rarity]?.sort_order ?? 0;
        const orderB = raritiesByCode[b.rarity]?.sort_order ?? 0;
        if (orderB !== orderA) return orderB - orderA;
        return pick(a.name, a.code).localeCompare(pick(b.name, b.code));
      });

      const sortedUsernames = [...usernamesSet].sort();
      if (JSON.stringify(sortedUsernames) !== JSON.stringify(knownUsernames)) {
        knownUsernames = sortedUsernames;
        const select = document.getElementById('user-filter');
        const currentValue = select.value;
        select.innerHTML = `<option value="">${I18N[currentLang].allUsers}</option>` +
          knownUsernames.map(u => `<option value="${escAttr(u)}">${esc(u)}</option>`).join('');
        select.value = knownUsernames.includes(currentValue) ? currentValue : '';
      }

      render();
    }

    function currentStatusFilter() {
      return document.getElementById('status-filter').value;
    }

    function render() {
      const t = I18N[currentLang];
      const filter = currentFilter();
      const statusFilter = currentStatusFilter();

      const revealedCount = allCards.filter(isRevealed).length;
      document.getElementById('progress-line').textContent = filter
        ? t.progressUser(revealedCount, allCards.length, filter)
        : t.progressCommunity(revealedCount, allCards.length);

      const grid = document.getElementById('grid');
      if (!allCards.length) {
        grid.innerHTML = `<div class="empty-state">${t.emptyNoCards}</div>`;
        return;
      }

      let cardsToShow = allCards;
      if (statusFilter === 'obtained') cardsToShow = allCards.filter(isRevealed);
      if (statusFilter === 'missing') cardsToShow = allCards.filter((c) => !isRevealed(c));

      if (!cardsToShow.length) {
        grid.innerHTML = `<div class="empty-state">${t.emptyNoMatch}</div>`;
        return;
      }

      grid.innerHTML = cardsToShow.map(c => {
        const rarity = raritiesByCode[c.rarity];
        const order = rarity?.sort_order ?? 1;
        const glowStyle = rarity
          ? `--glow-color:${hexToRgba(rarity.color_hex, 0.55)}; --glow-blur:${8 + order * 6}px; --glow-spread:${order}px;`
          : '';

        const revealed = isRevealed(c);
        const isNew = revealed && !previouslyRevealedIds.has(c.id);
        const clickable = revealed && !currentFilter();

        if (!revealed) {
          return `<div class="tile hidden-card" style="${glowStyle}">
            <div class="art"><div style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-family:'Cinzel',serif;font-size:48px;color:var(--border);">?</div></div>
            <div class="name">???</div>
          </div>`;
        }
        const imgUrl = pick(c.image_url, '');
        const name = pick(c.name, c.code);
        const qty = getDisplayQuantity(c);
        return `<div class="tile ${isNew ? 'just-revealed' : ''} ${clickable ? 'clickable' : ''}" style="${glowStyle}" ${clickable ? `onclick="showOwners('${c.id}')"` : ''}>
          <div class="art"><img src="${imgUrl}" alt="${name}" loading="lazy"></div>
          <div class="name">${name}</div>
          <div class="quantity">×${qty}</div>
        </div>`;
      }).join('');

      previouslyRevealedIds = new Set(allCards.filter(isRevealed).map(c => c.id));
    }

    function showOwners(cardId) {
      const t = I18N[currentLang];
      const card = cardsById.get(cardId);
      const owners = [...(ownersByCardId.get(cardId) || [])].sort((a, b) => b.quantity - a.quantity);
      document.getElementById('modal-card-name').textContent = pick(card?.name, card?.code || '');
      document.getElementById('modal-owners-list').innerHTML = owners.length
        ? owners.map(o => `<div>🎴 ${esc(o.username)} ×${o.quantity}</div>`).join('')
        : `<div style="color:var(--text-muted); font-style:italic;">${t.noOwnersYet}</div>`;
      document.getElementById('owners-modal').classList.add('open');
    }

    function closeOwnersModal() {
      document.getElementById('owners-modal').classList.remove('open');
    }

    function esc(s) {
      return String(s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }
    function escAttr(s) {
      return esc(s).replace(/"/g, '&quot;');
    }

    document.getElementById('user-filter').addEventListener('change', () => {
      previouslyRevealedIds = new Set();
      render();
    });
    document.getElementById('status-filter').addEventListener('change', () => {
      previouslyRevealedIds = new Set();
      render();
    });

    setLang('fr');
    load();
    setInterval(load, REFRESH_MS);
  </script>
</body>

</html>
