<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fellowship Hardcore</title>
  <link rel="icon" type="image/png" href="../images/pouf.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Crimson+Pro:ital,wght@0,300;0,400;1,300&display=swap" rel="stylesheet">
  <style>
    :root {
      --teal: #40d4d4;
      --teal-light: #72e8e8;
      --teal-dim: #2a9898;
      --bg: #070b0b;
      --bg2: #0d1a1a;
      --bg3: #122424;
      --border: rgba(64,212,212,0.28);
      --border-bright: rgba(64,212,212,0.65);
      --text: #f0fafa;
      --text-dim: #c8f0f0;
      --text-muted: #6ba8a8;
      --tier1: #44ee44;
      --tier2: #40d4d4;
      --tier3: #c4a0ff;
      --hc-red: #ff4444;
      --hc-red-dim: rgba(255,68,68,0.18);
      --hc-gold: #f0c040;
      --hc-champion: #af4bef;
      --hc-paragon: #f4dd40;
      --hc-eternal: #d44448;
      --twitch: #9147ff;
      --discord: #5865f2;
      --youtube: #ff0000;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Crimson Pro', Georgia, serif;
      font-weight: 300;
      min-height: 100vh;
      font-size: 19px;
    }
    body::before {
      content: '';
      position: fixed; inset: 0;
      background:
        radial-gradient(ellipse 80% 50% at 50% -5%, rgba(64,212,212,0.08) 0%, transparent 60%),
        radial-gradient(ellipse 40% 40% at 5% 85%, rgba(255,68,68,0.04) 0%, transparent 50%),
        radial-gradient(ellipse 30% 30% at 95% 15%, rgba(196,160,255,0.05) 0%, transparent 50%);
      pointer-events: none; z-index: 0;
    }

    .top-line {
      height: 2px;
      background: linear-gradient(90deg, transparent, #882222 15%, var(--hc-red) 40%, #882222 60%, rgba(196,160,255,0.6) 80%, transparent);
    }

    /* ── SOCIAL ── */
    .social-links { display:flex; flex-wrap:wrap; justify-content:center; gap:8px; margin-top:10px; }
    .social-link {
      display:inline-flex; align-items:center; gap:7px;
      padding:6px 14px; border:1px solid var(--border); border-radius:3px;
      text-decoration:none; color:var(--text-dim); font-size:12px;
      font-family:'Cinzel',serif; letter-spacing:0.1em; text-transform:uppercase;
      transition:all 0.25s; background:rgba(255,255,255,0.02); white-space:nowrap;
    }
    .social-link svg { flex-shrink:0; width:14px; height:14px; }
    .social-link:hover { color:var(--text); background:rgba(255,255,255,0.04); }
    .social-link.twitch:hover  { border-color:var(--twitch); color:var(--twitch); box-shadow:0 0 12px rgba(145,71,255,0.15); }
    .social-link.discord:hover { border-color:var(--discord); color:var(--discord); box-shadow:0 0 12px rgba(88,101,242,0.15); }
    .social-link.youtube:hover { border-color:var(--youtube); color:var(--youtube); box-shadow:0 0 12px rgba(255,0,0,0.12); }

    /* ── HEADER ── */
    header {
      text-align:center; padding:44px 24px 28px;
      border-bottom:1px solid var(--border);
      position:relative; z-index:1;
    }
    .event-skull { font-size:32px; margin-bottom:8px; filter:drop-shadow(0 0 12px rgba(255,68,68,0.5)); }
    .event-title {
      font-family:'Cinzel',serif; font-size:clamp(24px,5vw,44px); font-weight:700;
      color:var(--hc-red); letter-spacing:0.12em; text-transform:uppercase;
      text-shadow:0 0 40px rgba(255,68,68,0.5), 0 0 80px rgba(255,68,68,0.2);
    }
    .event-subtitle { font-size:15px; color:var(--text-dim); margin-top:8px; letter-spacing:0.18em; text-transform:uppercase; font-weight:300; }
    .event-season { display:inline-flex; align-items:center; gap:8px; margin-top:10px; font-size:13px; color:var(--text-muted); font-family:'Cinzel',serif; letter-spacing:0.12em; }

    /* ── NAV ── */
    nav {
      display:flex; align-items:center; gap:2px;
      padding:10px 24px;
      border-bottom:1px solid var(--border);
      position:sticky; top:0; z-index:100;
      background:rgba(7,11,11,0.95);
      backdrop-filter:blur(12px);
    }
    .tab {
      font-family:'Cinzel',serif; font-size:13px; letter-spacing:0.12em;
      text-transform:uppercase; padding:8px 16px;
      background:none; border:1px solid transparent;
      color:var(--text-muted); cursor:pointer; transition:all 0.2s; border-radius:3px;
    }
    .tab:hover { border-color:var(--border); color:var(--text-dim); }
    .tab.active { color:var(--hc-red); border-color:rgba(255,68,68,0.5); background:rgba(255,68,68,0.06); }
    .home-btn { opacity:0.65; color:var(--text-dim); }
    .home-btn:hover { opacity:1; color:var(--teal-light); }
    .nav-sep { width:1px; height:20px; background:var(--border); margin:0 4px; align-self:center; }
    .nav-right { margin-left:auto; display:flex; align-items:center; gap:8px; }
    .lang-toggle { display:flex; gap:2px; }
    .lang-btn {
      font-family:'Cinzel',serif; font-size:12px; letter-spacing:0.1em;
      padding:6px 11px; background:var(--bg2); border:1px solid var(--border);
      color:var(--text-muted); cursor:pointer; transition:all 0.2s;
    }
    .lang-btn:first-child { border-radius:3px 0 0 3px; }
    .lang-btn:last-child  { border-radius:0 3px 3px 0; }
    .lang-btn.active { color:var(--hc-red); border-color:rgba(255,68,68,0.5); background:rgba(255,68,68,0.08); font-weight:600; }

    /* ── MAIN ── */
    main { position:relative; z-index:1; max-width:980px; margin:0 auto; padding:36px 24px 80px; }
    .page { display:none; }
    .page.active { display:block; }

    /* ── SECTION TITLE ── */
    .section-title {
      font-family:'Cinzel',serif; font-size:11px; letter-spacing:0.28em; text-transform:uppercase;
      color:var(--text-muted); margin-bottom:20px; padding-bottom:10px;
      border-bottom:1px solid var(--border);
    }

    /* ── SYNC BAR ── */
    .lb-toolbar { display:flex; align-items:center; justify-content:space-between; margin-bottom:18px; gap:12px; }
    .sync-info { display:flex; align-items:center; gap:8px; font-size:14px; color:var(--text-muted); font-style:italic; }
    .sync-dot { width:8px; height:8px; border-radius:50%; background:var(--text-muted); flex-shrink:0; }
    .sync-dot.ok   { background:var(--tier1); box-shadow:0 0 7px var(--tier1); }
    .sync-dot.error { background:var(--hc-red); box-shadow:0 0 7px var(--hc-red); }
    .sync-dot.live { background:var(--teal); box-shadow:0 0 7px var(--teal); animation:sdot 1s ease-in-out infinite; }
    @keyframes sdot { 0%,100%{opacity:1} 50%{opacity:0.3} }
    .refresh-btn {
      display:inline-flex; align-items:center; gap:6px;
      font-family:'Cinzel',serif; font-size:11px; letter-spacing:0.14em; text-transform:uppercase;
      padding:7px 14px; background:var(--bg2); border:1px solid var(--border); border-radius:3px;
      color:var(--text-muted); cursor:pointer; transition:all 0.2s;
    }
    .refresh-btn:hover { border-color:var(--border-bright); color:var(--text-dim); }
    .refresh-btn.spinning svg { animation:spin 0.8s linear infinite; }
    @keyframes spin { to { transform:rotate(360deg); } }

    /* ── SEARCH ── */
    .lb-search-row { display:flex; align-items:center; gap:12px; margin-bottom:12px; }
    .lb-search-wrap {
      flex:1; display:flex; align-items:center; gap:8px;
      background:var(--bg2); border:1px solid var(--border); border-radius:4px;
      padding:0 12px; transition:border-color 0.2s;
    }
    .lb-search-wrap:focus-within { border-color:rgba(255,68,68,0.5); }
    .lb-search-wrap input {
      flex:1; background:none; border:none; outline:none;
      color:var(--text); font-family:'Crimson Pro',serif; font-size:16px;
      padding:9px 0; caret-color:var(--hc-red);
    }
    .lb-search-wrap input::placeholder { color:var(--text-muted); }
    .lb-search-clear { background:none; border:none; color:var(--text-muted); cursor:pointer; font-size:14px; padding:4px; transition:color 0.2s; }
    .lb-search-clear:hover { color:var(--text); }
    .lb-count { font-family:'Cinzel',serif; font-size:11px; letter-spacing:0.12em; color:var(--text-muted); white-space:nowrap; }

    /* ── LEADERBOARD TABLE ── */
    .lb-header {
      display:grid; grid-template-columns:44px 1fr 100px 100px 110px;
      padding:0 14px 10px; gap:8px;
      font-family:'Cinzel',serif; font-size:10px; letter-spacing:0.18em;
      text-transform:uppercase; color:var(--text-muted);
      border-bottom:1px solid var(--border);
    }
    .lb-row {
      display:grid; grid-template-columns:44px 1fr 100px 100px 110px;
      padding:0 14px; gap:8px; align-items:center;
      border-bottom:1px solid rgba(64,212,212,0.07);
      cursor:pointer; transition:background 0.15s; min-height:52px;
    }
    .lb-row:hover { background:rgba(255,68,68,0.04); }
    .lb-row.expanded { background:rgba(255,68,68,0.06); border-bottom:none; }
    .lb-rank {
      font-family:'Cinzel',serif; font-size:13px; font-weight:700;
      color:var(--text-muted); text-align:center;
    }
    .lb-rank.r1 { color:var(--hc-gold); text-shadow:0 0 14px rgba(240,192,64,0.5); }
    .lb-rank.r2 { color:#c0c0c0; }
    .lb-rank.r3 { color:#cd7f32; }
    .lb-player { display:flex; flex-direction:column; gap:2px; }
    .lb-player-name { font-size:17px; color:var(--text); }
    .lb-char-list { display:flex; flex-wrap:wrap; gap:6px; margin-top:2px; }
    .lb-char-tag {
      display:inline-flex; align-items:center; gap:5px;
      font-family:'Cinzel',serif; font-size:10px; letter-spacing:0.1em;
      padding:2px 8px; border-radius:20px; border:1px solid;
    }
    .lb-char-tag.alive  { border-color:rgba(64,212,212,0.3); color:var(--teal-dim); background:rgba(64,212,212,0.06); }
    .lb-char-tag.dead   { border-color:rgba(255,68,68,0.3); color:rgba(255,68,68,0.6); background:rgba(255,68,68,0.05); text-decoration:line-through; }
    .lb-char-skull { font-size:10px; }
    .lb-ilvl { font-family:'Cinzel',serif; font-size:14px; color:var(--teal-light); text-align:right; }
    .lb-ilvl.dead { color:var(--text-muted); }
    .lb-attempts { font-family:'Cinzel',serif; font-size:13px; color:var(--text-muted); text-align:right; }
    .lb-capstone { text-align:right; }
    .capstone-badge {
      display:inline-block; font-family:'Cinzel',serif; font-size:10px;
      letter-spacing:0.12em; padding:3px 9px; border-radius:20px; border:1px solid;
      white-space:nowrap;
    }
    .capstone-badge.champion { color:var(--hc-champion); border-color:rgba(175,75,239,0.4); background:rgba(175,75,239,0.08); }
    .capstone-badge.paragon  { color:var(--hc-paragon);  border-color:rgba(244,221,64,0.4); background:rgba(244,221,64,0.08); }
    .capstone-badge.eternal  { color:var(--hc-eternal);  border-color:rgba(212,68,72,0.4);  background:rgba(212,68,72,0.08); }

    /* ── EXPAND PANEL ── */
    .lb-expand {
      background:rgba(7,11,11,0.8); border-bottom:1px solid var(--border);
      padding:14px 14px 18px 14px;
      display:none;
    }
    .lb-expand.open { display:block; }
    .expand-grid { display:grid; grid-template-columns:1fr 1fr; gap:18px; }
    .expand-char-card {
      background:var(--bg2); border:1px solid var(--border); border-radius:6px;
      padding:16px 18px;
    }
    .expand-char-card.dead-card { border-color:rgba(255,68,68,0.25); background:rgba(255,68,68,0.03); }
    .expand-char-header { display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; }
    .expand-char-name { font-family:'Cinzel',serif; font-size:14px; color:var(--text); }
    .expand-char-class { font-size:13px; color:var(--text-muted); font-style:italic; }
    .expand-stat-row { display:flex; justify-content:space-between; align-items:baseline; padding:4px 0; border-bottom:1px solid rgba(64,212,212,0.07); font-size:15px; }
    .expand-stat-row:last-child { border-bottom:none; }
    .expand-stat-label { color:var(--text-muted); font-size:13px; }
    .expand-stat-value { color:var(--teal-light); font-family:'Cinzel',serif; font-size:13px; }
    .expand-stat-value.red { color:rgba(255,68,68,0.8); }
    .expand-death-info { margin-top:10px; padding:8px 10px; background:rgba(255,68,68,0.06); border-radius:4px; border-left:2px solid rgba(255,68,68,0.4); font-size:14px; color:rgba(255,68,68,0.7); }
    .expand-capstones { display:flex; flex-wrap:wrap; gap:6px; margin-top:10px; }

    /* ── PAGINATION ── */
    #lb-pagination { display:flex; align-items:center; justify-content:center; gap:4px; margin-top:16px; flex-wrap:wrap; }
    .pg-btn {
      font-family:'Cinzel',serif; font-size:12px; letter-spacing:0.08em;
      min-width:36px; height:36px; padding:0 10px;
      background:var(--bg2); border:1px solid var(--border); border-radius:3px;
      color:var(--text-muted); cursor:pointer; transition:all 0.2s;
      display:flex; align-items:center; justify-content:center;
    }
    .pg-btn:hover:not(:disabled) { border-color:var(--border-bright); color:var(--text-dim); }
    .pg-btn.active { color:var(--hc-red); border-color:rgba(255,68,68,0.5); background:rgba(255,68,68,0.07); }
    .pg-btn:disabled { opacity:0.3; cursor:default; }

    /* ── EVENTS CATALOGUE ── */
    .events-filters { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:18px; }
    .evt-filter {
      font-family:'Cinzel',serif; font-size:11px; letter-spacing:0.12em; text-transform:uppercase;
      padding:6px 14px; background:var(--bg2); border:1px solid var(--border); border-radius:3px;
      color:var(--text-muted); cursor:pointer; transition:all 0.2s;
    }
    .evt-filter:hover { border-color:var(--border-bright); color:var(--text-dim); }
    .evt-filter.active { color:var(--hc-red); border-color:rgba(255,68,68,0.5); background:rgba(255,68,68,0.07); }
    .evt-list { display:flex; flex-direction:column; gap:8px; }
    .evt-item {
      display:flex; align-items:center; gap:14px;
      padding:12px 16px; background:var(--bg2); border:1px solid var(--border);
      border-radius:5px; transition:border-color 0.15s;
    }
    .evt-item.death    { border-left:3px solid rgba(255,68,68,0.6); }
    .evt-item.capstone { border-left:3px solid rgba(196,160,255,0.6); }
    .evt-item.trophy   { border-left:3px solid rgba(255,211,107,0.7); }
    .evt-item.new_attempt { border-left:3px solid rgba(64,212,212,0.4); }
    /* Cartes « overlay » : même langage visuel que les alertes OBS */
    .evc { position:relative; display:flex; align-items:center; gap:16px; padding:14px 18px 14px 16px; min-height:84px;
      border:1px solid var(--cb,#55555588); border-top:2px solid var(--c,#555); border-radius:6px; overflow:hidden;
      background:#0a0e12; box-shadow:0 0 18px var(--cg,#00000022); }
    .evc-bg { position:absolute; inset:0; z-index:0; background-size:cover; background-position:center; }
    .evc-bg::after { content:''; position:absolute; inset:0;
      background:linear-gradient(90deg, rgba(var(--tint),.95) 0%, rgba(var(--tint),.78) 45%, rgba(var(--tint),.45) 100%); }
    .evc.ev-death    { --tint:14,4,4; }
    .evc.ev-capstone { --tint:5,9,24; }
    .evc.ev-trophy   { --tint:18,13,4; }
    .evc > *:not(.evc-bg) { position:relative; z-index:1; }
    .evc-bubble { width:56px; height:56px; border-radius:50%; flex-shrink:0; overflow:hidden; display:flex; align-items:center; justify-content:center;
      border:2px solid var(--hc,#d89be8); background:rgba(0,0,0,.45); box-shadow:0 0 14px rgba(0,0,0,.6); font-size:24px; }
    .evc-bubble img { width:100%; height:100%; object-fit:cover; display:block; }
    .evc-bubble.tro { border-radius:0; border:0; background:none; box-shadow:none; width:60px; height:60px; overflow:visible; }
    .evc-bubble .timg { width:60px; height:60px; }
    .evc-main { flex:1; min-width:0; display:flex; flex-direction:column; gap:3px; }
    .evc-type { font-family:'Cinzel',serif; font-size:11px; font-weight:800; letter-spacing:.2em; text-transform:uppercase;
      color:var(--tc,#fff); text-shadow:0 0 12px var(--c,#000), 0 1px 3px #000; }
    .evc-name { font-family:'Cinzel',serif; font-size:19px; font-weight:700; line-height:1.15; text-shadow:0 1px 6px #000; }
    .evc-name small { font-size:12px; font-weight:600; opacity:.6; margin-left:6px; letter-spacing:.06em; }
    .evc-sub { display:flex; flex-wrap:wrap; align-items:center; gap:8px 10px; font-size:14px; }
    .evc-dung { font-family:'Crimson Pro',serif; font-style:italic; font-size:17px; color:#f6eeea; text-shadow:0 1px 6px #000, 0 0 14px rgba(0,0,0,.8); }
    .evc-pill { font-family:'Cinzel',serif; font-size:12px; font-weight:800; letter-spacing:.08em; padding:2px 11px; border-radius:20px;
      border:1.5px solid; white-space:nowrap; text-shadow:0 1px 4px rgba(0,0,0,.95); }
    .evc-pill.score { color:#ffe08a; border-color:#ffcf5a; background:rgba(60,40,0,.72); box-shadow:0 0 12px rgba(255,200,80,.4); }
    .evc-desc { font-size:13px; font-style:italic; color:#d9cdb4; text-shadow:0 1px 4px #000; }
    .evc-side { display:flex; flex-direction:column; align-items:flex-end; gap:6px; flex-shrink:0; }
    .evc-time { font-family:'Cinzel',serif; font-size:11px; color:#b9c2c2; white-space:nowrap; text-shadow:0 1px 3px #000; }
    .evc-emoji { font-size:30px; opacity:.85; filter:drop-shadow(0 0 8px var(--c,#000)); line-height:1; }
    @media (max-width:600px) {
      .evc { gap:12px; padding:12px; }
      .evc-bubble { width:46px; height:46px; }
      .evc-emoji { display:none; }
      .evc-name { font-size:16px; }
    }
    /* ── Événements en tableau ── */
    .et-datebar { display:flex; flex-wrap:wrap; align-items:center; gap:8px 10px; margin:-6px 0 16px; }
    .et-datebar label { font-family:'Cinzel',serif; font-size:12px; letter-spacing:.08em; color:var(--text-muted); }
    .et-datebar input[type=date] { background:var(--bg2); border:1px solid var(--border); border-radius:3px; color:var(--text);
      padding:6px 10px; font:inherit; font-size:15px; color-scheme:dark; }
    .et-datebar input[type=date]:focus-visible { outline:2px solid var(--teal); outline-offset:2px; }
    #evt-count { margin-left:auto; color:var(--text-muted); font-size:15px; }
    .et-wrap { border:1px solid var(--border); border-radius:5px; overflow:hidden; background:var(--bg2); }
    .et-table { width:100%; border-collapse:collapse; }
    .et-table th { text-align:left; font-family:'Cinzel',serif; font-size:11px; font-weight:700; letter-spacing:.1em; color:var(--text-muted);
      background:var(--bg3); padding:9px 12px; white-space:nowrap; }
    .et-table td { padding:9px 12px; border-top:1px solid rgba(64,212,212,.12); vertical-align:middle; font-size:16px; }
    .et-table tbody tr:hover td { background:rgba(64,212,212,.05); }
    .et-table td.t-date { white-space:nowrap; color:var(--text-muted); font-size:14px; box-shadow:inset 3px 0 0 var(--c,#555); }
    .et-table td.t-att { color:var(--text-muted); text-align:right; font-variant-numeric:tabular-nums; }
    .et-type { font-family:'Cinzel',serif; font-size:12px; font-weight:700; letter-spacing:.05em; color:var(--tc,#fff); white-space:nowrap; }
    .et-hero { display:flex; align-items:center; gap:10px; min-width:0; }
    .et-hero img { width:30px; height:30px; border-radius:50%; object-fit:cover; border:1.5px solid var(--hc); flex:none; }
    .et-hero b { font-family:'Cinzel',serif; font-size:15px; font-weight:700; color:var(--hc); }
    .et-hero small { opacity:.6; margin-left:6px; font-size:12px; }
    .et-detail { display:flex; flex-wrap:wrap; align-items:center; gap:6px 10px; }
    .et-table .evc-dung { font-size:16px; text-shadow:none; }
    .et-table .evc-desc { text-shadow:none; }
    .et-table .evc-pill { text-shadow:none; }
    .et-table .timg { width:34px; height:34px; }
    #events-pagination { display:flex; align-items:center; justify-content:center; gap:4px; margin-top:16px; flex-wrap:wrap; }
    @media (max-width:700px) {
      .et-table thead { display:none; }
      .et-table tr { display:grid; grid-template-columns:1fr auto; gap:6px 10px; padding:10px 12px; border-top:1px solid rgba(64,212,212,.12); border-left:3px solid var(--c,#555); }
      .et-table td { display:block; border:0; padding:0; box-shadow:none !important; }
      .et-table tbody tr:hover td { background:none; }
      .et-table td.t-type { grid-row:1; grid-column:1; }
      .et-table td.t-date { grid-row:1; grid-column:2; text-align:right; }
      .et-table td.t-hero, .et-table td.t-detail { grid-column:1 / -1; }
      .et-table td.t-att { display:none; }
      #evt-count { margin-left:0; width:100%; }
    }
    .evt-icon { font-size:20px; flex-shrink:0; width:28px; text-align:center; }
    .evt-icon .timg { width:34px; height:34px; margin-left:-3px; }
    .evt-body { flex:1; }
    .evt-title { font-size:16px; color:var(--text); }
    .evt-title strong { color:var(--hc-red); }
    .evt-title.cap strong { color:var(--hc-eternal); }
    .evt-meta { font-size:13px; color:var(--text-muted); margin-top:2px; font-style:italic; }
    .evt-time { font-family:'Cinzel',serif; font-size:11px; color:var(--text-muted); white-space:nowrap; flex-shrink:0; }

    /* ── RULES PAGE ── */
    .rules-section { margin-bottom:36px; }
    .rules-section-title {
      font-family:'Cinzel',serif; font-size:12px; letter-spacing:0.22em; text-transform:uppercase;
      color:var(--text-dim); margin-bottom:16px; padding-bottom:10px;
      border-bottom:1px solid var(--border);
    }
    .rules-list { display:flex; flex-direction:column; gap:10px; }
    .rules-item {
      padding:12px 16px; background:var(--bg2); border:1px solid var(--border);
      border-radius:4px; font-size:16px; line-height:1.6; color:var(--text-dim);
    }
    .rules-item strong { color:var(--text); }
    .rules-item.warning { border-color:rgba(255,68,68,0.3); background:rgba(255,68,68,0.04); }
    .rules-item.warning strong { color:var(--hc-red); }
    .capstone-table { width:100%; border-collapse:collapse; margin-top:8px; }
    .capstone-table th {
      font-family:'Cinzel',serif; font-size:11px; letter-spacing:0.18em; text-transform:uppercase;
      padding:8px 12px; text-align:left; color:var(--text-muted);
      border-bottom:1px solid var(--border);
    }
    .capstone-table td { padding:10px 12px; font-size:15px; border-bottom:1px solid rgba(64,212,212,0.07); }
    .capstone-table tr:last-child td { border-bottom:none; }
    .ct-champion { color:var(--hc-champion); font-family:'Cinzel',serif; font-size:13px; }
    .ct-paragon  { color:var(--hc-paragon);  font-family:'Cinzel',serif; font-size:13px; }
    .ct-eternal  { color:var(--hc-eternal);  font-family:'Cinzel',serif; font-size:13px; }

    /* ── REGISTER PAGE ── */
    .register-card {
      background:var(--bg2); border:1px solid var(--border); border-radius:8px;
      padding:28px 32px; max-width:540px; margin:0 auto;
    }
    .register-title {
      font-family:'Cinzel',serif; font-size:14px; letter-spacing:0.2em; text-transform:uppercase;
      color:var(--text-dim); margin-bottom:8px;
    }
    .register-desc { font-size:15px; color:var(--text-muted); margin-bottom:28px; line-height:1.6; font-style:italic; }
    .field { display:flex; flex-direction:column; gap:6px; margin-bottom:18px; }
    .field label { font-family:'Cinzel',serif; font-size:11px; letter-spacing:0.18em; text-transform:uppercase; color:var(--text-muted); }
    .field input, .field select {
      background:var(--bg3); border:1px solid var(--border); border-radius:4px;
      color:var(--text); font-family:'Crimson Pro',serif; font-size:16px;
      padding:10px 14px; outline:none; transition:border-color 0.2s;
    }
    .field input:focus, .field select:focus { border-color:rgba(255,68,68,0.5); }
    .field input::placeholder { color:var(--text-muted); }
    .field select option { background:var(--bg3); }
    .field-hint { font-size:13px; color:var(--text-muted); font-style:italic; margin-top:2px; }
    .btn-register {
      width:100%; padding:12px; font-family:'Cinzel',serif; font-size:13px; letter-spacing:0.2em;
      text-transform:uppercase; background:rgba(255,68,68,0.1); border:1px solid rgba(255,68,68,0.4);
      color:var(--hc-red); border-radius:4px; cursor:pointer; transition:all 0.2s; margin-top:8px;
    }
    .btn-register:hover { background:rgba(255,68,68,0.18); border-color:rgba(255,68,68,0.7); }
    .btn-register:disabled { opacity:0.4; cursor:default; }
    .register-result { margin-top:16px; padding:12px 16px; border-radius:4px; font-size:15px; display:none; }
    .register-result.ok  { background:rgba(68,238,68,0.08); border:1px solid rgba(68,238,68,0.3); color:var(--tier1); }
    .register-result.err { background:rgba(255,68,68,0.08); border:1px solid rgba(255,68,68,0.3); color:var(--hc-red); }
    .register-result.show { display:block; }
    .register-warning {
      padding:12px 16px; background:rgba(255,68,68,0.06); border:1px solid rgba(255,68,68,0.25);
      border-radius:4px; font-size:14px; color:rgba(255,68,68,0.8); margin-bottom:22px; line-height:1.6;
    }

    /* ── LOADING / EMPTY ── */
    .loading { text-align:center; padding:48px 0; color:var(--text-muted); font-style:italic; font-size:16px; }
    .empty   { text-align:center; padding:48px 0; color:var(--text-muted); font-style:italic; font-size:16px; }

    /* ── TOAST ── */
    .toast {
      position:fixed; bottom:28px; left:50%; transform:translateX(-50%) translateY(80px);
      background:var(--bg3); border:1px solid var(--border); border-radius:4px;
      padding:10px 20px; font-family:'Cinzel',serif; font-size:12px; letter-spacing:0.1em;
      color:var(--text-dim); pointer-events:none; transition:transform 0.3s; z-index:999;
      white-space:nowrap;
    }
    .toast.show { transform:translateX(-50%) translateY(0); }
    .toast.error { border-color:rgba(255,68,68,0.4); color:var(--hc-red); }

    /* ── MODAL ── */
    .modal-overlay {
      display:none; position:fixed; inset:0; background:rgba(0,0,0,0.75);
      backdrop-filter:blur(4px); z-index:500; align-items:center; justify-content:center;
    }
    .modal-overlay.open { display:flex; }
    .modal {
      background:var(--bg2); border:1px solid var(--border); border-radius:8px;
      max-width:680px; width:calc(100% - 32px); max-height:85vh; overflow-y:auto;
    }
    .modal-header {
      display:flex; align-items:center; justify-content:space-between;
      padding:18px 22px; border-bottom:1px solid var(--border);
      position:sticky; top:0; background:var(--bg2); z-index:1;
    }
    .modal-player-name { font-family:'Cinzel',serif; font-size:16px; color:var(--text); }
    .modal-close { background:none; border:none; color:var(--text-muted); cursor:pointer; font-size:18px; padding:4px 8px; transition:color 0.2s; }
    .modal-close:hover { color:var(--text); }
    .modal-body { padding:20px 22px 24px; }
    .modal-section-title { font-family:'Cinzel',serif; font-size:11px; letter-spacing:0.2em; text-transform:uppercase; color:var(--text-muted); margin-bottom:14px; }
    .modal-chars { display:flex; flex-direction:column; gap:14px; }
    .modal-char {
      background:var(--bg3); border:1px solid var(--border); border-radius:6px; padding:14px 16px;
    }
    .modal-char.dead-char { border-color:rgba(255,68,68,0.2); }
    .modal-char-header { display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; }
    .modal-char-name { font-family:'Cinzel',serif; font-size:14px; color:var(--text); }
    .modal-char-status-alive { font-family:'Cinzel',serif; font-size:10px; letter-spacing:0.15em; color:var(--teal-dim); padding:2px 8px; border:1px solid rgba(64,212,212,0.3); border-radius:20px; }
    .modal-char-status-dead  { font-family:'Cinzel',serif; font-size:10px; letter-spacing:0.15em; color:rgba(255,68,68,0.7); padding:2px 8px; border:1px solid rgba(255,68,68,0.3); border-radius:20px; }
    .modal-stats-grid { display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px; }
    .modal-stat { text-align:center; padding:8px; background:rgba(0,0,0,0.2); border-radius:4px; }
    .modal-stat-val { font-family:'Cinzel',serif; font-size:18px; color:var(--teal-light); }
    .modal-stat-val.red { color:rgba(255,68,68,0.8); }
    .modal-stat-lbl { font-family:'Cinzel',serif; font-size:10px; letter-spacing:0.15em; text-transform:uppercase; color:var(--text-muted); margin-top:2px; }
    .modal-capstones { display:flex; flex-wrap:wrap; gap:6px; margin-top:12px; }
    .modal-death-info { margin-top:10px; padding:8px 12px; background:rgba(255,68,68,0.06); border-radius:4px; border-left:2px solid rgba(255,68,68,0.4); font-size:14px; color:rgba(255,68,68,0.65); font-style:italic; }

    /* ── EXPAND HERO TABLE ── */
    .hero-table { width:100%; border-collapse:collapse; }
    .hero-table th { font-family:'Cinzel',serif; font-size:10px; letter-spacing:0.18em; text-transform:uppercase; color:var(--text-muted); padding:6px 10px; text-align:left; border-bottom:1px solid var(--border); }
    .hero-table th:not(:first-child) { text-align:right; }
    .hero-table td { padding:8px 10px; border-bottom:1px solid rgba(64,212,212,0.05); font-size:14px; vertical-align:middle; }
    .hero-table td:not(:first-child) { text-align:right; }
    .hero-table tr:last-child td { border-bottom:none; }
    .hero-table tr.hero-row { cursor:pointer; transition:background 0.15s; }
    .hero-table tr.hero-row:hover { background:rgba(255,68,68,0.04); }
    .hero-table tr.hero-row.expanded-hero { background:rgba(255,68,68,0.06); }
    .hero-table tr.hero-runs-row td { padding:0; background:var(--bg3); }
    .hero-table tr.hero-runs-row.open { display:table-row; }
    .hero-runs-inner { padding:12px 14px; display:none; }
    .hero-runs-inner.open { display:block; }
    .hero-run-item { display:grid; grid-template-columns:1fr 120px 80px 80px 90px; gap:8px; align-items:center; padding:6px 0; border-bottom:1px solid rgba(64,212,212,0.06); font-size:13px; }
    .hero-run-item:last-child { border-bottom:none; }
    .hero-run-dungeon { color:var(--text-dim); }
    .hero-run-rank { text-align:right; }
    .hero-run-rating { font-family:'Cinzel',serif; font-size:12px; color:var(--teal-light); text-align:right; }
    .hero-run-date { color:var(--text-muted); font-size:12px; text-align:right; }
    .hero-run-timed { text-align:center; }
    .hero-name-cell { display:flex; align-items:center; gap:8px; }
    .hero-status-dot { width:7px; height:7px; border-radius:50%; flex-shrink:0; }

    /* ── JOIN STEPS (logs section) ── */
    .join-step { display:flex; gap:18px; margin-bottom:24px; align-items:flex-start; }
    .join-step-num { flex-shrink:0; width:32px; height:32px; border-radius:50%; background:rgba(255,68,68,0.1); border:1px solid rgba(255,68,68,0.4); display:flex; align-items:center; justify-content:center; font-family:'Cinzel',serif; font-size:13px; font-weight:700; color:var(--hc-red); margin-top:2px; }
    .join-step-body { flex:1; }
    .join-step-title { font-family:'Cinzel',serif; font-size:13px; letter-spacing:0.15em; text-transform:uppercase; color:var(--text-dim); margin-bottom:8px; }
    .join-step-desc { font-size:15px; color:var(--text-muted); line-height:1.7; margin-bottom:10px; }
    .join-step-desc a { color:var(--hc-red); text-decoration:none; border-bottom:1px solid rgba(255,68,68,0.35); }
    .join-step-desc strong { color:var(--text); font-weight:400; }
    .join-screenshot { background:var(--bg2); border:1px solid var(--border); border-radius:6px; overflow:hidden; margin-top:4px; }
    .join-screenshot-label { font-family:'Cinzel',serif; font-size:10px; letter-spacing:0.15em; text-transform:uppercase; color:var(--text-muted); padding:6px 12px; border-bottom:1px solid var(--border); }
    .join-url-demo { padding:12px 14px; }
    .join-url-bar { background:var(--bg3); border:1px solid var(--border); border-radius:4px; padding:8px 12px; font-family:monospace; font-size:12px; color:var(--text-muted); word-break:break-all; line-height:1.6; }
    .url-highlight { color:var(--hc-red); font-weight:700; background:rgba(255,68,68,0.1); padding:1px 5px; border-radius:3px; }
    .url-dim { color:var(--text-muted); }
    .join-url-caption { font-size:13px; color:var(--text-muted); font-style:italic; margin-top:6px; }

    /* Recap onboarding */
    .recap-card { background:var(--bg3); border:1px solid var(--border); border-radius:6px; padding:16px 18px; margin-bottom:12px; }
    .recap-row { display:flex; justify-content:space-between; align-items:baseline; padding:6px 0; border-bottom:1px solid rgba(255,68,68,0.08); font-size:15px; }
    .recap-row:last-child { border-bottom:none; }
    .recap-label { color:var(--text-muted); font-size:13px; }
    .recap-val { color:var(--text-dim); font-family:'Cinzel',serif; font-size:13px; }
    .recap-heroes { display:flex; flex-wrap:wrap; gap:6px; margin-top:4px; }
    .recap-hero-tag { font-family:'Cinzel',serif; font-size:10px; padding:2px 8px; border-radius:20px; border:1px solid; }


    /* ── LEADERBOARD v2 ── */
    .lb-header { grid-template-columns: 48px 1fr 150px 100px 170px; font-size:11px; letter-spacing:0.12em; }
    .lb-row    { grid-template-columns: 48px 1fr 150px 100px 170px; }

    /* Hero portrait squares in expand panel */
    .hero-portraits { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:20px; }
    .hero-portrait {
      width:64px; flex-shrink:0; cursor:pointer; border-radius:6px; overflow:hidden;
      border:2px solid var(--border); transition:all 0.2s; position:relative;
    }
    .hero-portrait:hover  { border-color:rgba(255,255,255,0.4); transform:translateY(-2px); }
    .hero-portrait.active { border-color:var(--hc-red); box-shadow:0 0 12px rgba(255,68,68,0.4); }
    .hero-portrait.dead   { filter:grayscale(0.6); }
    .hero-portrait img    { width:64px; height:64px; object-fit:cover; object-position:top; display:block; }
    .hero-portrait-skull  {
      position:absolute; bottom:3px; right:3px; font-size:14px;
      filter:drop-shadow(0 0 3px rgba(0,0,0,0.9));
    }
    /* hero-portrait-attempt removed — no longer shown */

    /* Hero detail card */
    .hero-detail { margin-bottom:20px; }
    .hero-detail-stats {
      display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-bottom:16px;
    }
    .hero-detail-stat {
      background:var(--bg3); border:1px solid var(--border); border-radius:6px;
      padding:12px; text-align:center;
    }
    .hero-detail-stat-val {
      font-family:'Cinzel',serif; font-size:20px; font-weight:700; color:var(--teal-light);
    }
    .hero-detail-stat-lbl {
      font-family:'Cinzel',serif; font-size:9px; letter-spacing:0.18em; text-transform:uppercase;
      color:var(--text-muted); margin-top:4px;
    }

    /* ── DUNGEON TABLE ── */
    .dungeon-table-wrap { border-radius:6px; overflow:hidden; border:1px solid var(--border); }
    .dungeon-table-header {
      display:grid; grid-template-columns:1fr 160px 90px 80px;
      padding:8px 16px; border-bottom:1px solid var(--border); background:var(--bg3);
    }
    .dungeon-table-header span {
      font-family:'Cinzel',serif; font-size:9px; letter-spacing:0.18em;
      text-transform:uppercase; color:var(--text-dim); font-weight:700;
    }
    .dungeon-table-header span:not(:first-child) { text-align:right; }

    .dungeon-table { display:block; }
    .dungeon-row {
      position:relative; overflow:hidden;
      min-height:60px;
      border-bottom:1px solid rgba(0,0,0,0.4);
      display:flex; align-items:stretch;
      transition:filter 0.2s;
    }
    .dungeon-row:last-child { border-bottom:none; }
    .dungeon-row:hover { filter:brightness(1.1); }

    .dungeon-row-bg {
      position:absolute; inset:0;
      background-size:cover; background-position:center;
      z-index:0;
    }
    .dungeon-row-overlay {
      position:absolute; inset:0; z-index:1;
      background:rgba(7,11,11,0.52);
    }
    .dungeon-row-content {
      position:relative; z-index:2;
      display:grid; grid-template-columns:1fr 160px 90px 80px;
      align-items:center; width:100%;
      padding:0 16px;
    }
    .dungeon-name {
      font-family:'Cinzel',serif; font-size:14px; font-weight:700;
      color:#ffffff; line-height:1.3; padding:14px 0;
      text-shadow:0 2px 8px rgba(0,0,0,0.95), 0 0 20px rgba(0,0,0,0.7);
    }
    .dungeon-name.xul {
      color:#f0a060;
      text-shadow:0 0 14px rgba(200,115,42,0.8), 0 2px 6px rgba(0,0,0,0.95);
    }
    .dungeon-key {
      text-align:right;
      font-family:'Cinzel',serif; font-size:14px; font-weight:700;
      text-shadow:0 2px 6px rgba(0,0,0,0.95);
    }
    .dungeon-score {
      text-align:right;
      font-family:'Cinzel',serif; font-size:13px; color:#72e8e8;
      text-shadow:0 1px 4px rgba(0,0,0,0.9);
    }
    .dungeon-time {
      text-align:right;
      font-size:12px; color:#c8e8e8;
      text-shadow:0 1px 4px rgba(0,0,0,0.9);
    }

    @media (max-width:700px) {
      main { padding:20px 14px 64px; }
      .lb-header, .lb-row { grid-template-columns:36px 1fr 80px 70px; }
      .lb-header .col-attempts, .lb-row .col-attempts { display:none; }
      .expand-grid { grid-template-columns:1fr; }
      .modal-stats-grid { grid-template-columns:1fr 1fr; }
      nav { padding:8px 10px; flex-wrap:wrap; gap:4px; }
    }

    /* ── PROFILE PAGE ── */
    .profile-visitor {
      max-width:480px; margin:0 auto; text-align:center; padding:48px 0;
    }
    .profile-visitor-title {
      font-family:'Cinzel',serif; font-size:18px; letter-spacing:0.15em; text-transform:uppercase;
      color:var(--text-dim); margin-bottom:10px;
    }
    .profile-visitor-desc { font-size:15px; color:var(--text-muted); font-style:italic; margin-bottom:28px; line-height:1.7; }
    .profile-magic-form {
      background:var(--bg2); border:1px solid var(--border); border-radius:8px;
      padding:24px 28px; text-align:left;
    }
    .profile-magic-title {
      font-family:'Cinzel',serif; font-size:11px; letter-spacing:0.22em; text-transform:uppercase;
      color:var(--text-muted); margin-bottom:16px; text-align:center;
    }
    .profile-magic-row { display:flex; gap:8px; }
    .profile-magic-row input {
      flex:1; background:var(--bg3); border:1px solid var(--border); border-radius:4px;
      color:var(--text); font-family:'Crimson Pro',serif; font-size:16px;
      padding:10px 14px; outline:none; transition:border-color 0.2s;
    }
    .profile-magic-row input:focus { border-color:rgba(255,68,68,0.5); }
    .profile-magic-row input::placeholder { color:var(--text-muted); }
    .btn-magic {
      padding:10px 18px; font-family:'Cinzel',serif; font-size:12px; letter-spacing:0.15em;
      text-transform:uppercase; background:rgba(255,68,68,0.1); border:1px solid rgba(255,68,68,0.4);
      color:var(--hc-red); border-radius:4px; cursor:pointer; transition:all 0.2s; white-space:nowrap;
    }
    .btn-magic:hover { background:rgba(255,68,68,0.18); }
    .btn-magic:disabled { opacity:0.4; cursor:default; }
    .profile-magic-sent {
      margin-top:14px; padding:10px 14px; border-radius:4px; font-size:14px;
      background:rgba(68,238,68,0.08); border:1px solid rgba(68,238,68,0.3); color:var(--tier1);
      display:none;
    }
    .profile-magic-sent.show { display:block; }

    /* Onboarding */
    .onboarding-card {
      max-width:560px; margin:0 auto;
      background:var(--bg2); border:1px solid var(--border); border-radius:8px; padding:28px 32px;
    }
    .onboarding-step-indicator {
      display:flex; gap:8px; margin-bottom:24px; align-items:center;
    }
    .onboarding-step-dot {
      width:28px; height:28px; border-radius:50%; border:1px solid var(--border);
      display:flex; align-items:center; justify-content:center;
      font-family:'Cinzel',serif; font-size:11px; color:var(--text-muted);
      transition:all 0.2s;
    }
    .onboarding-step-dot.active { border-color:rgba(255,68,68,0.6); color:var(--hc-red); background:rgba(255,68,68,0.08); }
    .onboarding-step-dot.done   { border-color:rgba(68,238,68,0.4); color:var(--tier1); background:rgba(68,238,68,0.06); }
    .onboarding-step-line { flex:1; height:1px; background:var(--border); }
    .onboarding-title {
      font-family:'Cinzel',serif; font-size:14px; letter-spacing:0.18em; text-transform:uppercase;
      color:var(--text-dim); margin-bottom:20px;
    }

    /* Heroes grid */
    .heroes-section { margin-bottom:20px; }
    .heroes-role-label {
      font-family:'Cinzel',serif; font-size:10px; letter-spacing:0.22em; text-transform:uppercase;
      color:var(--text-muted); margin-bottom:8px; padding-bottom:6px; border-bottom:1px solid var(--border);
    }
    .heroes-grid { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:16px; }
    .hero-toggle {
      display:flex; align-items:center; gap:8px;
      padding:8px 14px; border-radius:4px; border:1px solid var(--border);
      background:var(--bg3); cursor:pointer; transition:all 0.2s;
      font-family:'Cinzel',serif; font-size:12px; letter-spacing:0.1em;
      color:var(--text-muted); user-select:none;
    }
    .hero-toggle:hover { border-color:rgba(255,255,255,0.2); color:var(--text-dim); }
    .hero-toggle.selected { color:var(--text); }
    .hero-dot { width:8px; height:8px; border-radius:50%; flex-shrink:0; }
    .hero-toggle-check { font-size:10px; opacity:0; transition:opacity 0.15s; }
    .hero-toggle.selected .hero-toggle-check { opacity:1; }

    /* Profile connected */
    .profile-header {
      display:flex; align-items:center; justify-content:space-between;
      margin-bottom:28px; padding-bottom:16px; border-bottom:1px solid var(--border);
    }
    .profile-user { display:flex; flex-direction:column; gap:3px; }
    .profile-username { font-family:'Cinzel',serif; font-size:18px; color:var(--text); }
    .profile-email { font-size:14px; color:var(--text-muted); font-style:italic; }
    .btn-logout {
      font-family:'Cinzel',serif; font-size:11px; letter-spacing:0.14em; text-transform:uppercase;
      padding:7px 14px; background:var(--bg2); border:1px solid var(--border); border-radius:3px;
      color:var(--text-muted); cursor:pointer; transition:all 0.2s;
    }
    .btn-logout:hover { border-color:rgba(255,68,68,0.4); color:var(--hc-red); }

    /* Section persos */
    .profile-section-title {
      font-family:'Cinzel',serif; font-size:11px; letter-spacing:0.22em; text-transform:uppercase;
      color:var(--text-muted); margin-bottom:14px; padding-bottom:8px; border-bottom:1px solid var(--border);
    }
    .profile-hero-card {
      background:var(--bg2); border:1px solid var(--border); border-radius:6px;
      padding:16px 18px; margin-bottom:10px; transition:border-color 0.2s;
    }
    .profile-hero-card.hm-on { border-color:rgba(255,68,68,0.35); }
    .profile-hero-header {
      display:flex; align-items:center; justify-content:space-between; margin-bottom:10px;
    }
    .profile-hero-name { font-family:'Cinzel',serif; font-size:15px; }
    .profile-hero-role { font-size:13px; color:var(--text-muted); font-style:italic; margin-left:8px; }
    .hm-toggle-pill {
      display:flex; align-items:center; gap:8px;
      font-family:'Cinzel',serif; font-size:11px; letter-spacing:0.12em; text-transform:uppercase;
    }
    .hm-toggle-switch {
      position:relative; width:36px; height:20px; cursor:pointer;
    }
    .hm-toggle-switch input { display:none; }
    .hm-toggle-track {
      position:absolute; inset:0; border-radius:20px;
      background:var(--bg3); border:1px solid var(--border); transition:all 0.25s;
    }
    .hm-toggle-thumb {
      position:absolute; top:3px; left:3px; width:12px; height:12px;
      border-radius:50%; background:var(--text-muted); transition:all 0.25s;
    }
    .hm-toggle-switch input:checked ~ .hm-toggle-track {
      background:rgba(255,68,68,0.15); border-color:rgba(255,68,68,0.5);
    }
    .hm-toggle-switch input:checked ~ .hm-toggle-thumb {
      background:var(--hc-red); transform:translateX(16px);
    }
    .profile-hero-stats {
      display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-top:10px;
    }
    .profile-hero-stat { text-align:center; padding:6px; background:rgba(0,0,0,0.2); border-radius:4px; }
    .profile-hero-stat-val { font-family:'Cinzel',serif; font-size:15px; color:var(--teal-light); }
    .profile-hero-stat-val.dead { color:rgba(255,68,68,0.7); }
    .profile-hero-stat-lbl { font-family:'Cinzel',serif; font-size:9px; letter-spacing:0.14em; text-transform:uppercase; color:var(--text-muted); margin-top:2px; }
    .profile-period {
      font-size:13px; color:var(--text-muted); font-style:italic; margin-top:6px;
    }

    /* Warnings */
    .profile-warnings { margin-top:28px; }
    .profile-warning-item {
      display:flex; align-items:flex-start; gap:12px;
      padding:12px 16px; background:var(--bg2); border:1px solid rgba(255,68,68,0.25);
      border-radius:5px; margin-bottom:8px; cursor:pointer; transition:opacity 0.2s;
    }
    .profile-warning-item.read { opacity:0.45; }
    .profile-warning-icon { font-size:18px; flex-shrink:0; }
    .profile-warning-body { flex:1; }
    .profile-warning-msg { font-size:15px; color:var(--text-dim); }
    .profile-warning-time { font-size:12px; color:var(--text-muted); font-style:italic; margin-top:3px; }

    /* Code contact */
    .profile-contact-box {
      margin-top:28px; padding:16px 18px; background:var(--bg2); border:1px solid var(--border);
      border-radius:6px;
    }
    .profile-contact-code {
      font-family:'Cinzel',serif; font-size:20px; letter-spacing:0.2em; color:var(--teal-light);
      text-align:center; margin:10px 0;
    }
    .btn-copy {
      display:block; width:100%; margin-top:8px;
      font-family:'Cinzel',serif; font-size:11px; letter-spacing:0.15em; text-transform:uppercase;
      padding:8px; background:var(--bg3); border:1px solid var(--border); border-radius:3px;
      color:var(--text-muted); cursor:pointer; transition:all 0.2s; text-align:center;
    }
    .btn-copy:hover { border-color:var(--border-bright); color:var(--text-dim); }

    /* ── PROFILE TABS ── */
    .profile-tabs {
      display:flex; gap:0; border-bottom:2px solid var(--border);
      margin-bottom:28px;
    }
    .profile-tab-btn {
      font-family:'Cinzel',serif; font-size:11px; letter-spacing:0.2em; text-transform:uppercase;
      padding:12px 20px; background:none; border:none; border-bottom:2px solid transparent;
      color:var(--text-muted); cursor:pointer; transition:all 0.2s; margin-bottom:-2px;
    }
    .profile-tab-btn:hover { color:var(--text-dim); }
    .profile-tab-btn.active { color:var(--hc-red); border-bottom-color:var(--hc-red); }

    /* ── HERO CARDS v2 ── */
    .hero-card-v2 {
      background:var(--bg2); border:1px solid var(--border); border-radius:8px;
      padding:20px 24px; margin-bottom:14px; transition:border-color 0.2s;
      position:relative;
    }
    .hero-card-v2.hm-on { border-color:rgba(255,68,68,0.4); }
    .hero-card-v2.hm-on::before {
      content:''; position:absolute; top:0; left:0; right:0; height:2px;
      background:linear-gradient(90deg, transparent, rgba(255,68,68,0.6), transparent);
      border-radius:8px 8px 0 0;
    }
    .hero-card-v2-header {
      display:flex; align-items:center; justify-content:space-between; margin-bottom:16px;
    }
    .hero-card-v2-title {
      display:flex; align-items:baseline; gap:10px;
    }
    .hero-card-v2-name {
      font-family:'Cinzel',serif; font-size:22px; font-weight:700; letter-spacing:0.05em;
    }
    .hero-card-v2-role {
      font-size:14px; color:var(--text-muted); font-style:italic;
    }
    .hero-card-v2-stats {
      display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin-bottom:14px;
    }
    .hero-stat-block {
      background:rgba(0,0,0,0.25); border:1px solid var(--border); border-radius:6px;
      padding:12px 14px; text-align:center;
    }
    .hero-stat-block-val {
      font-family:'Cinzel',serif; font-size:22px; font-weight:700; color:var(--teal-light);
      line-height:1;
    }
    .hero-stat-block-lbl {
      font-family:'Cinzel',serif; font-size:9px; letter-spacing:0.2em; text-transform:uppercase;
      color:var(--text-muted); margin-top:5px;
    }
    .hero-card-v2-footer {
      display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:8px;
    }
    .hero-status-badge {
      display:inline-flex; align-items:center; gap:6px;
      font-family:'Cinzel',serif; font-size:11px; letter-spacing:0.14em; text-transform:uppercase;
      padding:5px 12px; border-radius:20px; border:1px solid;
    }
    .hero-status-badge.alive {
      color:var(--tier1); border-color:rgba(68,238,68,0.3); background:rgba(68,238,68,0.06);
    }
    .hero-status-badge.dead {
      color:rgba(255,68,68,0.7); border-color:rgba(255,68,68,0.3); background:rgba(255,68,68,0.06);
    }
    .hero-hm-since {
      font-size:13px; color:var(--text-muted); font-style:italic;
    }
    .hero-card-add {
      background:var(--bg2); border:1px dashed rgba(64,212,212,0.2); border-radius:8px;
      padding:16px 24px; margin-bottom:10px; display:flex; align-items:center;
      justify-content:space-between; opacity:0.6; transition:opacity 0.2s;
    }
    .hero-card-add:hover { opacity:1; }
    .hero-card-add-name {
      font-family:'Cinzel',serif; font-size:16px; font-weight:600;
    }

    /* ── EQUIPMENT GRID ── */
    .equip-hero-selector {
      display:flex; gap:8px; flex-wrap:wrap; margin-bottom:20px;
    }
    .equip-hero-btn {
      font-family:'Cinzel',serif; font-size:11px; letter-spacing:0.12em; text-transform:uppercase;
      padding:7px 14px; border-radius:4px; border:1px solid var(--border);
      background:var(--bg3); color:var(--text-muted); cursor:pointer; transition:all 0.2s;
    }
    .equip-hero-btn.active { color:var(--text); }
    .equip-snapshot-info {
      font-size:13px; color:var(--text-muted); font-style:italic; margin-bottom:18px;
    }
    .equip-grid {
      display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:24px;
    }
    .equip-item {
      display:flex; align-items:center; gap:12px;
      background:var(--bg2); border:1px solid var(--border); border-radius:6px;
      padding:10px 14px; transition:border-color 0.15s;
    }
    .equip-item:hover { border-color:rgba(64,212,212,0.35); }
    .equip-icon {
      width:42px; height:42px; border-radius:4px; flex-shrink:0;
      display:flex; align-items:center; justify-content:center;
      font-size:18px; border:1px solid;
    }
    .equip-info { flex:1; min-width:0; }
    .equip-name {
      font-size:14px; font-weight:600; white-space:nowrap; overflow:hidden;
      text-overflow:ellipsis; line-height:1.3;
    }
    .equip-meta {
      display:flex; gap:8px; align-items:center; margin-top:3px;
    }
    .equip-slot {
      font-size:11px; color:var(--text-muted); text-transform:uppercase;
      letter-spacing:0.1em; font-family:'Cinzel',serif;
    }
    .equip-ilvl {
      font-family:'Cinzel',serif; font-size:12px; font-weight:700;
      background:rgba(0,0,0,0.4); padding:1px 6px; border-radius:3px;
    }
    .equip-gs {
      font-family:'Cinzel',serif; font-size:11px; color:var(--text-muted);
    }
    .equip-totals {
      background:var(--bg2); border:1px solid var(--border); border-radius:6px;
      padding:14px 18px; display:flex; align-items:center; justify-content:space-between;
    }
    .equip-total-label {
      font-family:'Cinzel',serif; font-size:11px; letter-spacing:0.18em; text-transform:uppercase;
      color:var(--text-muted);
    }
    .equip-total-val {
      font-family:'Cinzel',serif; font-size:24px; font-weight:700; color:var(--teal-light);
    }
    .equip-empty {
      text-align:center; padding:40px; color:var(--text-muted); font-style:italic; font-size:15px;
    }

    /* ── HISTORIQUE TAB ── */
    .hist-section { margin-bottom:28px; }
    .hist-section-title {
      font-family:'Cinzel',serif; font-size:11px; letter-spacing:0.22em; text-transform:uppercase;
      color:var(--text-muted); margin-bottom:12px; padding-bottom:8px; border-bottom:1px solid var(--border);
    }
    .hist-run-item {
      display:grid; grid-template-columns:1fr 130px 80px 70px 90px;
      gap:10px; align-items:center; padding:10px 0;
      border-bottom:1px solid rgba(64,212,212,0.05); font-size:15px;
    }
    .hist-run-item:last-child { border-bottom:none; }

    /* ── QUALITY COLORS ── */
    .q0 { color:#c8c8c8; border-color:rgba(200,200,200,0.4); background:rgba(200,200,200,0.06); }
    .q1 { color:#00c700; border-color:rgba(0,199,0,0.4);    background:rgba(0,199,0,0.08); }
    .q2 { color:#006fe6; border-color:rgba(0,111,230,0.4);  background:rgba(0,111,230,0.08); }
    .q3 { color:#a920fd; border-color:rgba(169,32,253,0.4); background:rgba(169,32,253,0.08); }
    .q4 { color:#b79f00; border-color:rgba(183,159,0,0.4);  background:rgba(183,159,0,0.08); }
    .q5 { color:#b60000; border-color:rgba(182,0,0,0.4);    background:rgba(182,0,0,0.08); }
    .q6 { color:#e96326; border-color:rgba(233,99,38,0.4);  background:rgba(233,99,38,0.08); }

    /* ── SLOT NAMES ── */

    /* ══ PROFIL v2 ══════════════════════════════════════════════════════════════ */
    /* Sélecteur de héros */
    .pick-row { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:16px; }
    .pick { position:relative; width:54px; height:54px; padding:0; border-radius:8px; overflow:hidden; border:2px solid var(--border); background:var(--bg3); cursor:pointer; transition:transform .15s, border-color .15s; }
    .pick img { width:100%; height:100%; object-fit:cover; object-position:top; display:block; }
    .pick:hover { transform:translateY(-2px); }
    .pick.new { opacity:.45; filter:grayscale(.6); }
    .pick.new:hover { opacity:.85; }
    .pick.on { border-color:rgba(255,68,68,.75); }
    .pick.sel { border-color:var(--hc); box-shadow:0 0 0 2px var(--hc), 0 0 14px var(--hc); }
    .pick-dot { position:absolute; right:4px; bottom:4px; width:13px; height:13px; border-radius:50%; border:1.5px solid rgba(0,0,0,.7); background:#6ba8a8; }
    .pick-dot.on { background:#ff4444; box-shadow:0 0 6px #ff4444; }
    .pick-plus { position:absolute; right:4px; bottom:0; font-weight:700; font-size:18px; color:#fff; text-shadow:0 0 4px #000; }

    /* Prochain trophée */
    .next-trophy { display:flex; align-items:center; gap:12px; margin-bottom:16px; padding:10px 14px; background:var(--bg2); border:1px solid var(--border); border-radius:8px; }
    .nt-ico { font-size:22px; }
    /* Image de trophée (repli sur l'emoji si le fichier manque) */
    .timg { display:inline-flex; align-items:center; justify-content:center; line-height:1; }
    .timg img { display:block; width:100%; height:100%; object-fit:contain; filter:drop-shadow(0 2px 6px rgba(0,0,0,.55)); }
    .timg .temoji { display:none; }
    .timg.noimg img { display:none; }
    .timg.noimg .temoji { display:inline; }
    .nt-ico .timg { width:44px; height:44px; }
    .nt-body { flex:1; min-width:0; }
    .nt-label { font-size:15px; color:var(--text-muted); margin-bottom:6px; }
    .nt-pct { font-family:'Cinzel',serif; font-size:13px; font-weight:700; color:var(--text-dim); }
    .trophy-bar { height:6px; background:rgba(255,255,255,.08); border-radius:3px; overflow:hidden; }
    .trophy-bar div { height:100%; background:var(--tc, var(--teal-light)); border-radius:3px; }

    /* Héros en vedette : équipement de chaque côté du portrait */
    .spot { position:relative; display:grid; grid-template-columns:76px minmax(0,1fr) 76px; gap:16px; align-items:start; padding:18px; background:var(--bg2); border:1px solid var(--border); border-radius:12px; overflow:hidden; }
    .spot::before { content:''; position:absolute; inset:0; background:radial-gradient(ellipse at 50% 0%, var(--hc-soft), transparent 65%); pointer-events:none; }
    .spot > * { position:relative; }
    .spot-center { padding-top:0; }
    .spot-slots { display:flex; flex-direction:column; gap:8px; }
    .gslot { position:relative; width:76px; height:62px; box-sizing:border-box; border-width:2px; border-style:solid; border-radius:8px; display:flex; align-items:center; justify-content:center; font-family:'Cinzel',serif; }
    .gslot-ico { font-size:24px; filter:drop-shadow(0 1px 2px rgba(0,0,0,.6)); }
    /* Silhouette d'emplacement teintée par la rareté : le masque donne la forme, currentColor (.q0…q6) la couleur */
    .gslot-ico.sil { width:38px; height:38px; background:currentColor; -webkit-mask:var(--ico) center/contain no-repeat; mask:var(--ico) center/contain no-repeat; }
    .gslot-ilvl { position:absolute; right:5px; bottom:2px; font-size:13px; font-weight:700; text-shadow:0 1px 2px #000; }
    .gslot { backdrop-filter:blur(3px); box-shadow:inset 0 0 0 100px rgba(8,12,16,.6); }
    .gslot.empty { background:rgba(8,12,16,.6); border-color:rgba(255,255,255,.08); }
    .gslot.empty .gslot-ico { opacity:.18; }
    .gslot[data-itip] { cursor:help; outline:none; }
    .gslot[data-itip]:hover, .gslot[data-itip]:focus-visible { filter:brightness(1.25); }

    /* ── Infobulle d'objet façon écran de jeu (remplace le title HTML) ── */
    #itip { position:fixed; left:0; top:0; z-index:9999; width:272px; max-width:calc(100vw - 16px); pointer-events:none;
            opacity:0; visibility:hidden; transition:opacity .12s ease; border-radius:12px; overflow:hidden;
            background:#111416; border:1px solid color-mix(in srgb, var(--qc, #c8c8c8) 55%, #000);
            box-shadow:0 14px 36px rgba(0,0,0,.65), 0 0 0 1px rgba(0,0,0,.6), 0 0 22px color-mix(in srgb, var(--qc, #c8c8c8) 22%, transparent); }
    #itip.show { opacity:1; visibility:visible; }
    .itip-head { display:flex; align-items:center; gap:12px; padding:13px 14px;
                 background: radial-gradient(130% 160% at 88% -10%, color-mix(in srgb, var(--qc) 55%, transparent), transparent 62%),
                             linear-gradient(180deg, color-mix(in srgb, var(--qc) 34%, #0e1215), color-mix(in srgb, var(--qc) 16%, #0e1215)); }
    .itip-icon { flex:0 0 46px; width:46px; height:46px; border-radius:7px; display:flex; align-items:center; justify-content:center; overflow:hidden;
                 background:rgba(0,0,0,.45); border:1px solid color-mix(in srgb, var(--qc) 60%, #000); box-shadow:inset 0 0 12px rgba(0,0,0,.6); }
    .itip-icon img { width:100%; height:100%; object-fit:cover; display:block; }
    .itip-sil { display:block; width:30px; height:30px; background:var(--qc); -webkit-mask:var(--ico) center/contain no-repeat; mask:var(--ico) center/contain no-repeat; }
    .itip-emoji { font-size:24px; line-height:1; }
    .itip-name { font-family:'Cinzel',serif; font-size:16px; font-weight:700; line-height:1.2; color:#fff; text-shadow:0 1px 3px rgba(0,0,0,.7); overflow-wrap:anywhere; }
    .itip-sub  { margin-top:3px; font-size:13px; color:rgba(255,255,255,.62); }
    .itip-body { padding:12px 16px 14px; font-size:14.5px; color:#e8e8e8; }
    .itip-row  { display:flex; justify-content:space-between; align-items:baseline; gap:12px; padding:3px 0; }
    .itip-row span { color:rgba(255,255,255,.62); }
    .itip-row b { font-weight:600; color:#fff; }
    .itip-row.stat b { color:#58e0a8; }
    .itip-pips { display:inline-flex; gap:4px; vertical-align:middle; margin-right:8px; }
    .itip-pips i { width:9px; height:9px; border-radius:50%; background:rgba(255,255,255,.14); border:1px solid rgba(255,255,255,.25); }
    .itip-pips i.on { background:var(--qc); border-color:var(--qc); box-shadow:0 0 6px var(--qc); }
    .itip-sep  { height:1px; background:rgba(255,255,255,.1); margin:9px 0 8px; }
    .itip-q    { font-family:'Cinzel',serif; font-size:12px; letter-spacing:.12em; text-transform:uppercase; font-weight:700; color:var(--qc); }
    #itip.itip-empty { width:auto; min-width:120px; }
    #itip.itip-empty .itip-body { padding:9px 14px; }
    .spot-center { display:flex; flex-direction:column; gap:12px; min-width:0; }
    /* Portrait en fond de la carte : flou + assombri, l'équipement et les infos passent par-dessus */
    .spot > .spot-bg { position:absolute; inset:0; z-index:0; overflow:hidden; pointer-events:none; }
    .spot-bg img { width:100%; height:100%; object-fit:cover; object-position:center 0%; display:block; transform:scale(1.04); filter:blur(3px) saturate(1.05) brightness(.62); opacity:.55; }
    .spot-bg img.is-square { object-position:center 25%; }
    .spot-bg::after { content:''; position:absolute; inset:0; background:linear-gradient(90deg, rgba(8,12,16,.55) 0%, rgba(8,12,16,.12) 30%, rgba(8,12,16,.12) 70%, rgba(8,12,16,.55) 100%); }
    .spot-bg.dim img { filter:blur(3px) grayscale(.8) brightness(.5); }
    .spot::before { z-index:1; }
    .spot > .spot-slots, .spot > .spot-center { z-index:2; }
    .spot-name { display:flex; align-items:baseline; gap:10px; flex-wrap:wrap; }
    .spot-name b { font-family:'Cinzel',serif; font-size:34px; letter-spacing:.06em; }
    .spot-role { font-size:18px; font-style:italic; color:var(--text-muted); }
    .spot-badges { display:flex; flex-wrap:wrap; gap:8px; }
    .spot-rank { font-family:'Cinzel',serif; font-size:15px; font-weight:700; letter-spacing:.08em; padding:7px 16px; border-radius:20px; color:#fff; background:var(--rc); border:1px solid rgba(255,255,255,.4); text-shadow:0 1px 3px rgba(0,0,0,.75); }
    .spot-badges .hero-status-badge { font-size:15px; font-weight:700; letter-spacing:.06em; padding:7px 16px; color:#052b0c; background:#58f06a; border-color:#9bffa8; text-shadow:none; }
    .rk-badge { font-family:'Cinzel',serif; font-weight:700; color:#fff; background:var(--rc); border:1px solid rgba(255,255,255,.4); text-shadow:0 1px 3px rgba(0,0,0,.75); padding:4px 12px; border-radius:20px; white-space:nowrap; }
    .spot-surv { padding:10px 12px; background:rgba(9,13,17,.78); backdrop-filter:blur(4px); border:1px solid var(--border); border-radius:8px; }
    .spot-surv-top { display:flex; justify-content:space-between; align-items:baseline; margin-bottom:8px; font-size:17px; color:var(--text-dim); }
    .spot-surv-top b { font-family:'Cinzel',serif; font-size:24px; color:var(--text); }
    .spot-surv-rec { font-family:'Cinzel',serif; font-size:13px; letter-spacing:.12em; text-transform:uppercase; color:var(--text-muted); }
    .spot-stats { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; }
    .spot-stat { background:rgba(9,13,17,.78); backdrop-filter:blur(4px); border:1px solid var(--border); border-radius:8px; padding:10px; text-align:center; }
    .spot-stat b { display:block; font-family:'Cinzel',serif; font-size:24px; color:var(--teal-light); line-height:1.1; }
    .spot-stat span { font-family:'Cinzel',serif; font-size:12px; letter-spacing:.16em; text-transform:uppercase; color:var(--text-muted); }
    .spot-add { font-family:'Cinzel',serif; font-size:15px; letter-spacing:.1em; padding:12px 22px; border-radius:6px; cursor:pointer; align-self:flex-start; background:rgba(64,212,212,.12); border:2px solid rgba(64,212,212,.6); color:var(--teal-light); }

    /* Interrupteur HC : gros, deux états explicites, en tête de carte */
    .hm-banner { border-radius:10px; padding:10px 12px; border:2px solid var(--border); background:rgba(9,13,17,.78); transition:background .2s, border-color .2s, box-shadow .2s; }
    .hm-banner.on  { border-color:#ff4444; background:linear-gradient(180deg, rgba(255,68,68,.22), rgba(255,68,68,.08)), rgba(9,13,17,.78); box-shadow:0 0 16px rgba(255,68,68,.3); }
    .hm-banner.off { border-color:rgba(255,255,255,.28); }
    .hm-banner.busy { opacity:.6; pointer-events:none; }
    .hm-state { display:flex; align-items:center; gap:10px; font-family:'Cinzel',serif; font-weight:700; font-size:15px; letter-spacing:.06em; margin-bottom:3px; }
    .hm-banner.on .hm-state { color:#ff8a8a; }
    .hm-banner.off .hm-state { color:var(--text-dim); }
    .hm-dot { width:10px; height:10px; border-radius:50%; flex-shrink:0; background:#7a8a8a; }
    .hm-banner.on .hm-dot { background:#ff4444; box-shadow:0 0 10px #ff4444; animation:hmpulse 1.6s infinite; }
    @keyframes hmpulse { 50% { opacity:.45; } }
    .hm-sub { font-size:14px; line-height:1.35; color:var(--text-dim); margin-bottom:8px; }
    .spot-fresh { padding:10px 14px; border-radius:10px; border:2px solid #ffb84d; background:linear-gradient(rgba(255,184,77,.12), rgba(255,184,77,.12)), rgba(9,13,17,.78); }
    .spot-fresh-t { font-family:'Cinzel',serif; font-weight:700; font-size:16px; letter-spacing:.04em; color:#ffd08a; margin-bottom:4px; }
    .spot-fresh-b { font-size:15px; line-height:1.4; color:var(--text); }
    .hm-test { margin:-2px 0 8px; padding:5px 9px; font-size:13px; color:#ffd77a; background:rgba(255,200,60,.1); border:1px dashed rgba(255,200,60,.5); border-radius:6px; }
    .hm-since { font-family:'Crimson Pro',serif; font-size:14px; font-weight:500; letter-spacing:0; color:var(--text-dim); }
    .hm-seg { display:grid; grid-template-columns:1fr 1fr; gap:6px; }
    .hm-seg button { font-family:'Cinzel',serif; font-weight:700; font-size:14px; letter-spacing:.1em; padding:8px 8px; border-radius:6px; cursor:pointer; border:2px solid rgba(255,255,255,.2); background:rgba(255,255,255,.04); color:var(--text-muted); transition:all .15s; }
    .hm-seg button:hover:not(.cur) { border-color:rgba(255,255,255,.55); color:var(--text); }
    .hm-seg button.cur { cursor:default; }
    .hm-seg button.cur.is-off { background:#4a5858; border-color:#9fb4b4; color:#fff; }
    .hm-seg button.cur.is-on  { background:#d62f2f; border-color:#ff8a8a; color:#fff; box-shadow:0 0 14px rgba(255,68,68,.55); }

    .spot-danger { display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; padding:12px 14px; border-radius:10px; border:2px dashed rgba(255,68,68,.5); background:linear-gradient(rgba(255,68,68,.07), rgba(255,68,68,.07)), rgba(9,13,17,.78); }
    .spot-danger-txt { flex:1; min-width:160px; font-size:15px; line-height:1.35; color:var(--text-dim); }
    .spot-reset { font-family:'Cinzel',serif; font-weight:700; font-size:16px; letter-spacing:.1em; padding:12px 20px; border-radius:8px; cursor:pointer; color:#fff; background:#a31f1f; border:2px solid #ff6b6b; }
    .spot-reset:hover { background:#c42626; box-shadow:0 0 14px rgba(255,68,68,.5); }
    .spot-empty { font-size:18px; font-style:italic; color:var(--text-muted); }
    .fl-card { margin-top:18px; padding:14px 16px; border-radius:10px; border:1px solid rgba(255,255,255,.1); background:rgba(255,255,255,.03); }
    .fl-card.missing { border-color:rgba(255,170,0,.6); background:rgba(255,170,0,.07); }
    .fl-card-title { font-family:'Cinzel',serif; font-size:14px; letter-spacing:.06em; color:var(--text-dim); margin-bottom:6px; }
    .fl-card-ok { color:var(--tier1); font-size:13px; margin-left:6px; }
    .fl-card-txt { font-size:14px; line-height:1.5; color:var(--text-muted); margin-bottom:10px; }
    .fl-card-row { display:flex; gap:8px; flex-wrap:wrap; }
    .fl-card-row input { flex:1; min-width:220px; padding:9px 12px; border-radius:8px; border:1px solid rgba(255,255,255,.15); background:rgba(0,0,0,.25); color:var(--text); font-size:14px; }
    .fl-card-row button { padding:9px 16px; border-radius:8px; border:1px solid rgba(64,212,212,.5); background:rgba(64,212,212,.12); color:var(--teal-light); cursor:pointer; font-size:14px; }
    .spot-runs { display:flex; flex-direction:column; gap:4px; max-height:300px; overflow-y:auto; padding:10px 12px; border-radius:10px; background:rgba(9,13,17,.78); border:1px solid rgba(255,255,255,.1); }
    .spot-runs-title { font-family:'Cinzel',serif; font-size:13px; letter-spacing:.08em; color:var(--text-muted); margin-bottom:4px; }
    .spot-runs-empty { font-size:14px; font-style:italic; color:var(--text-muted); }
    .spot-run { display:grid; grid-template-columns:1fr auto auto auto auto; gap:10px; align-items:center; font-size:14px; padding:4px 0; border-top:1px solid rgba(255,255,255,.05); }
    .spot-run:first-of-type { border-top:0; }
    .sr-name { color:var(--text-dim); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .sr-rank { font-family:'Cinzel',serif; font-size:13px; }
    .sr-pts { color:var(--teal-light); font-family:'Cinzel',serif; font-size:13px; text-align:right; }
    .sr-time.ok { color:var(--tier1); } .sr-time.ko { color:var(--text-muted); }
    .sr-date { color:var(--text-muted); font-size:13px; text-align:right; }
    .spot-gear-note { font-size:14px; font-style:italic; color:var(--text-muted); text-align:center; }
    .spot-gear-note:not(:empty) { align-self:center; padding:5px 14px; border-radius:20px; background:rgba(9,13,17,.78); }

    /* ── Héros en vedette : visuel dégagé, infos aux quatre coins ─────────────────────────────── */
    .spot { align-items:stretch; }
    .spot-slots { justify-content:space-between; }
    .spot-center { min-height:560px; gap:0; }
    .spot-top { display:flex; justify-content:space-between; align-items:flex-start; gap:14px; }
    .spot-id { display:flex; flex-direction:column; gap:8px; align-items:flex-start; padding:8px 12px 10px; border-radius:10px; background:rgba(9,13,17,.6); backdrop-filter:blur(4px); }
    .spot-id .spot-name b { font-size:30px; }
    .spot-badges .hero-status-badge, .spot-badges .spot-rank { font-size:13px; padding:5px 12px; }
    .spot-hc { width:270px; max-width:46%; display:flex; flex-direction:column; gap:8px; }
    .spot-hc .hm-banner { padding:7px 9px; }
    .spot-hc .hm-state { font-size:13px; margin-bottom:2px; }
    .spot-hc .hm-sub { font-size:12px; margin-bottom:6px; }
    .spot-hc .hm-test { font-size:11.5px; padding:3px 7px; margin:0 0 6px; }
    .spot-hc .hm-seg { gap:5px; }
    .spot-hc .hm-seg button { font-size:12px; padding:5px 6px; letter-spacing:.08em; }
    .spot-hc .spot-fresh { padding:7px 10px; }
    .spot-hc .spot-fresh-t { font-size:13px; margin-bottom:2px; }
    .spot-hc .spot-fresh-b { font-size:12.5px; line-height:1.3; }
    .spot-gap { flex:1; min-height:260px; }
    .spot-bottom { display:flex; flex-direction:column; gap:8px; }
    .spot-foot { display:flex; justify-content:space-between; align-items:flex-end; gap:10px; flex-wrap:wrap; }
    .spot-foot .spot-gear-note:empty { display:none; }
    .spot-foot .spot-gear-note { align-self:flex-end; }
    .spot-foot .spot-danger { margin-left:auto; flex-wrap:nowrap; gap:10px; padding:5px 6px 5px 11px; border-width:1px; border-radius:8px; }
    .spot-foot .spot-danger-txt { flex:none; min-width:0; font-size:12px; line-height:1.2; }
    .spot-foot .spot-reset { font-size:12px; padding:5px 10px; border-width:1px; border-radius:6px; letter-spacing:.08em; }
    .spot-below { display:flex; flex-direction:column; gap:10px; margin-top:12px; }
    .spot-below .spot-runs { max-height:none; }

    /* Trophées */
    .trophy-head { display:flex; align-items:baseline; justify-content:space-between; gap:12px; flex-wrap:wrap; margin-bottom:14px; }
    .trophy-head b { font-family:'Cinzel',serif; font-size:20px; color:var(--text); }
    .trophy-head span { font-size:13px; font-style:italic; color:var(--text-muted); }
    .trophy-group { display:flex; align-items:baseline; gap:10px; margin:22px 0 10px; padding-bottom:6px; border-bottom:1px solid var(--border); font-family:'Cinzel',serif; font-size:16px; letter-spacing:.08em; color:var(--text); }
    .trophy-group i { font-style:normal; font-size:12px; color:var(--text-muted); }
    .trophy-grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(180px, 1fr)); gap:12px; }
    .trophy { padding:14px; text-align:center; background:var(--bg2); border:1px solid var(--border); border-radius:10px; }
    .trophy.done { border-color:var(--tc); box-shadow:0 0 14px var(--tc-soft); }
    .trophy-ico { font-size:34px; line-height:1; margin-bottom:8px; }
    .trophy-ico .timg { width:92px; height:92px; }
    .trophy.locked .trophy-ico { filter:grayscale(1); opacity:.35; }
    .trophy-title { font-family:'Cinzel',serif; font-size:14px; font-weight:700; color:var(--tc); }
    .trophy.locked .trophy-title { color:var(--text-muted); }
    .trophy-desc { margin:4px 0 8px; font-size:13px; line-height:1.35; color:var(--text-muted); }
    .trophy-prog { margin-top:4px; font-size:12px; color:var(--text-muted); }
    .trophy-done { font-family:'Cinzel',serif; font-size:11px; letter-spacing:.14em; color:var(--tc); }
    .trophy-pin { margin-top:10px; font-family:'Cinzel',serif; font-size:11px; letter-spacing:.1em; padding:6px 12px; border-radius:6px;
                  border:1px solid var(--tc); background:transparent; color:var(--tc); cursor:pointer; transition:background .15s, color .15s; }
    .trophy-pin:hover:not(:disabled) { background:var(--tc-soft); }
    .trophy-pin.on { background:var(--tc); color:#0b0e10; font-weight:700; }
    .trophy-pin:disabled { opacity:.35; cursor:not-allowed; }

    /* ── Badges affichés à côté du pseudo (3 max) ── */
    .bdgs { display:inline-flex; align-items:center; gap:3px; flex-shrink:0; }
    .bdg { display:inline-flex; width:26px; height:26px; cursor:help; outline:none; transition:transform .15s ease, filter .15s ease; }
    .bdg .timg { width:100%; height:100%; }
    .bdg:hover, .bdg:focus-visible { transform:translateY(-2px) scale(1.2); filter:drop-shadow(0 0 7px var(--tc)); }
    .bdgs.lg { gap:6px; }
    .bdgs.lg .bdg { width:38px; height:38px; }
    .profile-name-row { display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
    .bdg-bar { display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap; padding:14px 16px; margin-bottom:6px;
               background:var(--bg2); border:1px solid var(--border); border-radius:10px; }
    .bdg-bar-t { font-family:'Cinzel',serif; font-size:14px; letter-spacing:.06em; color:var(--text); }
    .bdg-bar-t small { display:block; margin-top:3px; font-family:inherit; font-size:12px; font-style:italic; letter-spacing:0; color:var(--text-muted); max-width:340px; line-height:1.4; }
    .bdg-slots { display:flex; gap:12px; }
    .bdg-slot { position:relative; width:60px; height:60px; display:flex; align-items:center; justify-content:center; border-radius:12px;
                border:1px dashed rgba(255,255,255,.16); background:rgba(0,0,0,.22); color:var(--text-muted); font-size:20px; outline:none; }
    .bdg-slot.on { border:1px solid var(--tc); background:radial-gradient(80% 80% at 50% 30%, var(--tc-soft), rgba(0,0,0,.25)); box-shadow:0 0 14px var(--tc-soft); cursor:help; }
    .bdg-slot .timg { width:48px; height:48px; }
    .bdg-x { position:absolute; top:-8px; right:-8px; width:22px; height:22px; padding:0; border-radius:50%; display:flex; align-items:center; justify-content:center;
             border:1px solid var(--border); background:#14181b; color:var(--text-muted); font-size:11px; line-height:1; cursor:pointer; }
    .bdg-x:hover { background:var(--hc-red); border-color:var(--hc-red); color:#fff; }
    #itip.itip-badge { width:264px; }
    .itip-bhead { display:flex; flex-direction:column; align-items:center; text-align:center; padding:18px 16px 12px;
                  background:radial-gradient(90% 95% at 50% 0%, color-mix(in srgb, var(--qc) 48%, transparent), transparent 72%),
                             linear-gradient(180deg, color-mix(in srgb, var(--qc) 20%, #0e1215), #0e1215); }
    .itip-bico { width:92px; height:92px; filter:drop-shadow(0 4px 10px rgba(0,0,0,.65)) drop-shadow(0 0 16px color-mix(in srgb, var(--qc) 60%, transparent)); }
    .itip-bico .timg { width:100%; height:100%; }
    .itip-bname { margin-top:8px; font-family:'Cinzel',serif; font-size:17px; font-weight:700; line-height:1.2; color:#fff; text-shadow:0 1px 3px rgba(0,0,0,.7); }
    .itip-bgroup { margin-top:3px; font-family:'Cinzel',serif; font-size:11px; letter-spacing:.16em; text-transform:uppercase; color:color-mix(in srgb, var(--qc) 55%, #fff); }
    .itip-bdesc { text-align:center; font-size:14px; line-height:1.4; color:#dcdcdc; }

    /* Cimetière en pyramide */
    .grave { display:flex; flex-direction:column; align-items:center; gap:14px; padding:8px 0; }
    .grave-row { display:flex; justify-content:center; flex-wrap:wrap; gap:12px; }
    .tomb { width:132px; box-sizing:border-box; padding:12px 8px 10px; text-align:center; background:linear-gradient(180deg, rgba(255,255,255,.07), rgba(255,255,255,.02)); border:1px solid rgba(255,255,255,.12); border-radius:66px 66px 8px 8px; }
    .tomb.top { width:176px; border-radius:88px 88px 8px 8px; border-color:rgba(255,255,255,.3); }
    .tomb-cross { font-size:16px; line-height:1; color:rgba(255,255,255,.35); }
    .tomb-tag { font-family:'Cinzel',serif; font-size:9px; letter-spacing:.16em; text-transform:uppercase; color:rgba(255,255,255,.5); }
    .tomb-art { width:68px; height:68px; margin:8px auto; border-radius:50%; overflow:hidden; border:2px solid rgba(255,255,255,.2); filter:grayscale(1) brightness(.75); }
    .tomb.top .tomb-art { width:92px; height:92px; }
    .tomb-art img { width:100%; height:100%; object-fit:cover; object-position:top; display:block; }
    .tomb-name { font-family:'Cinzel',serif; font-size:13px; font-weight:700; color:#c8c8c8; }
    .tomb-score { font-family:'Cinzel',serif; font-size:15px; font-weight:700; color:#dcdcdc; }
    .tomb-meta { font-size:11px; color:rgba(255,255,255,.4); }
    .grave-more { font-size:13px; font-style:italic; color:var(--text-muted); }
    .grave-empty { text-align:center; padding:40px 0; font-size:46px; }
    .grave-empty div { font-size:16px; color:var(--text-dim); margin-top:8px; }
    .grave-empty span { display:block; font-size:13px; font-style:italic; color:var(--text-muted); margin-top:4px; }

    /* ══ PODIUM et mouvements du classement ═════════════════════════════════════ */
    .podium { margin:0 0 16px; padding:12px 14px; background:var(--bg2); border:1px solid var(--border); border-radius:10px; }
    .podium-head { display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; font-family:'Cinzel',serif; font-size:11px; letter-spacing:.18em; text-transform:uppercase; color:var(--text-dim); }
    .podium-close { background:none; border:none; color:var(--text-muted); font-size:14px; cursor:pointer; }
    .podium-row { display:flex; justify-content:center; align-items:flex-end; gap:10px; }
    .podium-card { flex:1; max-width:240px; padding:10px 8px; text-align:center; background:rgba(0,0,0,.25); border:1px solid var(--border); border-radius:8px; }
    .podium-card.p1 { padding:16px 8px; border-color:rgba(255,200,60,.55); }
    .podium-card.p2 { border-color:rgba(200,200,200,.4); }
    .podium-card.p3 { border-color:rgba(205,127,50,.45); }
    .podium-medal { font-size:24px; }
    .podium-card.tie { max-width:360px; flex:1 1 260px; }
    .podium-tie { font-family:'Cinzel',serif; font-size:10px; letter-spacing:.16em; text-transform:uppercase; color:var(--text-muted); margin-bottom:4px; }
    .podium-names { margin:2px 0 6px; }
    .podium-names.scroll, .podium-names.manual { max-height:92px; position:relative; }
    .podium-names.scroll { overflow:hidden; -webkit-mask-image:linear-gradient(transparent 0, #000 14%, #000 86%, transparent 100%); mask-image:linear-gradient(transparent 0, #000 14%, #000 86%, transparent 100%); }
    .podium-names.manual { overflow-y:auto; scrollbar-width:thin; }
    .podium-names-inner { display:block; }
    .podium-names .podium-name { margin-bottom:3px; }
    .podium-names.scroll .podium-names-inner { animation:podScroll linear infinite; }
    .podium-names.scroll:hover .podium-names-inner { animation-play-state:paused; }
    @keyframes podScroll { from { transform:translateY(0); } to { transform:translateY(-50%); } }
    .podium-names .podium-name { text-shadow:0 1px 4px rgba(0,0,0,.6); }
    .podium-name { font-family:'Cinzel',serif; font-size:15px; font-weight:700; color:var(--text); }
    .podium-hero { font-family:'Cinzel',serif; font-size:11px; letter-spacing:.1em; }
    .podium-score { font-family:'Cinzel',serif; font-size:14px; color:var(--teal-light); margin-top:2px; }
    .podium-rank { font-family:'Cinzel',serif; font-size:11px; font-weight:700; }
