<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fellowship Hardcore — Stream Overlay</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Crimson+Pro:ital,wght@0,400;1,400&display=swap" rel="stylesheet">
  <style>
    /* ── RESET & BASE ── */
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: transparent;
      width: 1920px;
      height: 1080px;
      overflow: hidden;
      font-family: 'Cinzel', serif;
    }

    /* ── HERO ICONS (couleurs par classe) ── */
    :root {
      --c-helena:  #b26731;
      --c-meiko:   #29dd5c;
      --c-xavian:  #097265;
      --c-aeona:   #f99de9;
      --c-sylvie:  #e74f82;
      --c-vigour:  #dbd9c3;
      --c-rime:    #1ca2ec;
      --c-ardeos:  #e96326;
      --c-elarion: #925dfc;
      --c-tariq:   #5179f3;
      --c-mara:    #94598e;
      --c-gunde:   #933637;
      /* tiers donjons */
      --t-recrue:   #00c700;
      --t-adepte:   #006fe6;
      --t-champion: #a920fd;
      --t-parangon: #b79f00;
      --t-eternal:  #b60000;
    }

    /* ── ALERT WRAPPER — centré en haut ── */
    #alert-wrapper {
      position: absolute;
      top: 48px;
      left: 50%;
      transform: translateX(-50%);
      width: 860px;
      pointer-events: none;
    }

    /* ── ALERT CARD ── */
    .alert-card {
      width: 100%;
      opacity: 0;
      transform: translateY(-32px) scale(0.96);
      transition: none;
      position: relative;
      color: #f2eaea;
    }

    .alert-card.show {
      animation: alertIn 0.45s cubic-bezier(0.22, 1, 0.36, 1) forwards,
                 alertOut 0.5s ease-in 5.5s forwards;
    }

    @keyframes alertIn {
      from { opacity: 0; transform: translateY(-32px) scale(0.96); }
      to   { opacity: 1; transform: translateY(0)     scale(1); }
    }

    @keyframes alertOut {
      from { opacity: 1; transform: translateY(0) scale(1); }
      to   { opacity: 0; transform: translateY(-16px) scale(0.97); }
    }

    /* ── DEATH CARD ── */
    .alert-death {
      background:
        linear-gradient(180deg,
          rgba(12,4,4,0.97) 0%,
          rgba(30,6,6,0.95) 60%,
          rgba(12,4,4,0.97) 100%);
      border: 1px solid rgba(255,40,40,0.55);
      border-top: 3px solid #ff2828;
      border-radius: 6px;
      box-shadow:
        0 0 0 1px rgba(255,40,40,0.2),
        0 0 60px rgba(255,40,40,0.35),
        0 0 120px rgba(255,40,40,0.15),
        inset 0 1px 0 rgba(255,80,80,0.25);
      overflow: hidden;
    }

    /* ── CAPSTONE CARD ── */
    .alert-capstone {
      background:
        linear-gradient(180deg,
          rgba(4,8,20,0.97) 0%,
          rgba(8,14,36,0.95) 60%,
          rgba(4,8,20,0.97) 100%);
      border: 1px solid rgba(196,160,255,0.45);
      border-top: 3px solid #c4a0ff;
      border-radius: 6px;
      box-shadow:
        0 0 0 1px rgba(196,160,255,0.15),
        0 0 60px rgba(196,160,255,0.25),
        0 0 120px rgba(196,160,255,0.1),
        inset 0 1px 0 rgba(196,160,255,0.2);
      overflow: hidden;
    }

    /* ── TROPHY CARD ── */
    .alert-trophy {
      background:
        linear-gradient(180deg,
          rgba(20,14,4,0.97) 0%,
          rgba(34,24,8,0.95) 60%,
          rgba(20,14,4,0.97) 100%);
      border: 1px solid rgba(255,211,107,0.45);
      border-top: 3px solid #ffd36b;
      border-radius: 6px;
      box-shadow:
        0 0 0 1px rgba(255,211,107,0.15),
        0 0 60px rgba(255,211,107,0.25),
        0 0 120px rgba(255,211,107,0.1),
        inset 0 1px 0 rgba(255,211,107,0.2);
      overflow: hidden;
    }
    .alert-trophy .alert-type-label { color: #ffd36b; }
    .alert-trophy .alert-shimmer {
      background: linear-gradient(90deg, transparent 0%, #ffd36b 30%, #ffffff 50%, #ffd36b 70%, transparent 100%);
      background-size: 200% 100%;
    }
    .alert-trophy .alert-corner { color: #ffd36b; }
    .alert-trophy-name { font-size: 20px; font-weight: 700; letter-spacing: .04em; }
    .alert-trophy-desc { font-size: 14px; color: #e9dcc0; opacity: .8; font-style: italic; }

    /* ── INNER LAYOUT ── */
    .alert-inner {
      display: flex;
      align-items: center;
      gap: 0;
      height: 130px;
      position: relative;
      z-index: 2;
    }

    /* Image du donjon en fond, assombrie par la couleur de l'alerte pour garder le texte lisible */
    .alert-bg {
      position: absolute; inset: 0; z-index: 0;
      background-size: cover; background-position: center;
      filter: saturate(0.9);
    }
    .alert-bg::after {
      content: ''; position: absolute; inset: 0;
      background: linear-gradient(90deg, rgba(var(--tint),var(--a1,0.94)) 0%, rgba(var(--tint),var(--a2,0.74)) 45%, rgba(var(--tint),var(--a3,0.42)) 100%);
    }
    .alert-death    { --tint: 14,4,4; }
    .alert-capstone { --tint: 5,9,24; --a1: 0.88; --a2: 0.62; --a3: 0.34; }   /* donjon bien visible, juste assombri */

    /* ── HERO ICON ZONE ── */
    .alert-icon-zone {
      width: 120px;
      height: 130px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .alert-icon-zone::after {
      content: '';
      position: absolute;
      right: 0; top: 10%; bottom: 10%;
      width: 1px;
      background: linear-gradient(180deg, transparent, rgba(255,255,255,0.12), transparent);
    }

    .hero-icon {
      width: 84px;
      height: 84px;
      border-radius: 50%;
      border: 2px solid;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 30px;
      font-weight: 900;
      position: relative;
      overflow: hidden;
    }

    .hero-icon img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
    .alert-death .hero-icon img { filter: grayscale(0.35) brightness(0.92) contrast(1.05); }
    .hero-icon::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, rgba(255,255,255,0.18), transparent 60%);
    }

    /* Image de trophée à la place du médaillon héros */
    .trophy-img { width: 96px; height: 96px; object-fit: contain; filter: drop-shadow(0 0 14px rgba(255,211,107,0.55)) drop-shadow(0 3px 6px rgba(0,0,0,0.6)); }
    .trophy-emoji { font-size: 56px; filter: drop-shadow(0 0 10px rgba(255,211,107,0.6)); }

    /* ── CONTENT ZONE ── */
    .alert-content {
      flex: 1;
      padding: 0 28px 0 24px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 6px;
    }

    .alert-type-label {
      font-size: 11px;
      letter-spacing: 0.38em;
      text-transform: uppercase;
      opacity: 0.9;
      font-weight: 800;
      text-shadow: 0 1px 6px rgba(0,0,0,0.8);
    }

    .alert-death .alert-type-label { color: #ff7070; font-size: 14px; opacity: 1; text-shadow: 0 0 14px rgba(255,50,50,0.75), 0 1px 4px #000; }
    .alert-capstone .alert-type-label { color: #c4a0ff; font-size: 14px; opacity: 1; }

    .alert-headline {
      display: flex;
      align-items: baseline;
      gap: 10px;
      flex-wrap: wrap;
    }

    .alert-player-name {
      font-size: 34px;
      font-weight: 900;
      letter-spacing: 0.04em;
      line-height: 1;
      text-shadow: 0 0 30px currentColor;
    }

    .alert-hero-name {
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 0.12em;
      opacity: 0.65;
      align-self: center;
    }

    .alert-subline {
      font-size: 16px;
      letter-spacing: 0.06em;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .alert-dungeon {
      color: #f6eeea;
      text-shadow: 0 1px 6px #000, 0 0 14px rgba(0,0,0,0.8);
      font-family: 'Crimson Pro', serif;
      font-size: 20px;
      font-style: italic;
      font-weight: 400;
      letter-spacing: 0.04em;
    }

    .alert-gs-badge {
      font-size: 16px;
      font-weight: 800;
      letter-spacing: 0.08em;
      padding: 3px 14px;
      border-radius: 20px;
      border: 1.5px solid #ffcf5a;
      color: #ffe08a;
      background: rgba(60,40,0,0.72);
      box-shadow: 0 0 14px rgba(255,200,80,0.45);
      text-shadow: 0 1px 4px rgba(0,0,0,0.95);
      white-space: nowrap;
    }

    .alert-rank-badge {
      font-size: 16px;
      font-weight: 800;
      letter-spacing: 0.1em;
      padding: 3px 14px;
      border-radius: 20px;
      border: 1.5px solid;
      text-shadow: 0 1px 4px rgba(0,0,0,0.95), 0 0 8px rgba(0,0,0,0.6);
    }

    /* ── ATTEMPT COUNT (death only) ── */
    .alert-attempt {
      font-size: 12px;
      letter-spacing: 0.2em;
      opacity: 0.85;
      color: #ffc4c4;
      text-shadow: 0 1px 4px #000;
      font-weight: 700;
      margin-top: 2px;
    }

    /* ── SKULL / CROWN ACCENT ── */
    .alert-accent {
      width: 90px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 48px;
      opacity: 0.3;
    }
    .alert-death .alert-accent {
      font-size: 64px;
      opacity: 0.95;
      filter: drop-shadow(0 0 14px rgba(255,50,50,0.8)) drop-shadow(0 2px 4px rgba(0,0,0,0.8));
    }

    /* ── SHIMMER LINE (top) ── */
    .alert-shimmer {
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 1px;
      animation: shimmer 3s linear infinite;
    }

    .alert-death .alert-shimmer {
      background: linear-gradient(90deg, transparent 0%, #ff4444 30%, #ffaa00 50%, #ff4444 70%, transparent 100%);
      background-size: 200% 100%;
    }

    .alert-capstone .alert-shimmer {
      background: linear-gradient(90deg, transparent 0%, #c4a0ff 30%, #ffffff 50%, #c4a0ff 70%, transparent 100%);
      background-size: 200% 100%;
    }

    @keyframes shimmer {
      from { background-position: 200% 0; }
      to   { background-position: -200% 0; }
    }

    /* ── SCAN LINE EFFECT ── */
    .alert-card::after {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: 6px;
      background: repeating-linear-gradient(
        0deg,
        rgba(0,0,0,0) 0px,
        rgba(0,0,0,0) 3px,
        rgba(0,0,0,0.04) 3px,
        rgba(0,0,0,0.04) 4px
      );
      pointer-events: none;
    }

    /* ── CORNER DECORATIONS ── */
    .alert-corner {
      position: absolute;
      width: 12px; height: 12px;
      border-color: currentColor;
      border-style: solid;
      opacity: 0.4;
    }
    .alert-corner.tl { top: 6px; left: 6px; border-width: 1px 0 0 1px; }
    .alert-corner.tr { top: 6px; right: 6px; border-width: 1px 1px 0 0; }
    .alert-corner.bl { bottom: 6px; left: 6px; border-width: 0 0 1px 1px; }
    .alert-corner.br { bottom: 6px; right: 6px; border-width: 0 1px 1px 0; }
    .alert-death .alert-corner { color: #ff4444; }
    .alert-capstone .alert-corner { color: #c4a0ff; }
  </style>
</head>
<body>

<div id="alert-wrapper">
  <!-- Les alertes sont injectées ici dynamiquement -->
</div>

<script>
  // ── CONFIG ──────────────────────────────────────────────────────────────────
  const SUPABASE_URL      = 'https://ehsnzujkmtbzikdbqnjt.supabase.co';
  const SUPABASE_ANON_KEY = 'sb_publishable_GgNaGBPs4nD65Mt60yGJxA_82DhdeRO';
  const POLL_INTERVAL_MS  = 30_000;
  const ALERT_DURATION_MS = 6_000; // visible 6s avant de sortir

  // ── PARAMÈTRES D'URL ────────────────────────────────────────────────────────
  //   ?lang=fr | en          langue des annonces (défaut : fr)
  //   ?sound=on | off        son des annonces (défaut : on ; accepte aussi 1/0, true/false, mute)
  //   ?shared=1              mode PARTAGÉ : plusieurs overlays (plusieurs OBS) reçoivent chacun TOUTES les alertes.
  //                          Sans ce mode, le premier overlay qui interroge la base « consomme » l'alerte pour tout le monde.
  //   ?test=1                affiche UNE alerte de test à l'ouverture (mort par défaut ; ?test=death | capstone | trophy pour choisir).
  //                          Mode test = aucune lecture ni écriture en base : les vraies alertes ne sont pas consommées.
  //                          Pour revoir l'alerte : actualiser la source navigateur dans OBS.
  // Exemple : overlay.html?shared=1&lang=en&sound=off   ·   test : overlay.html?test=1&lang=en
  const _qs      = new URLSearchParams(location.search);
  const LANG     = (_qs.get('lang') || 'fr').toLowerCase().startsWith('en') ? 'en' : 'fr';
  const SOUND_ON = !['off', '0', 'false', 'no', 'mute', 'muted'].includes((_qs.get('sound') || 'on').toLowerCase());
  const SHARED   = ['1', 'true', 'on', 'yes'].includes((_qs.get('shared') || '').toLowerCase());
  const _test    = (_qs.get('test') || '').toLowerCase();
  const TEST_ON  = _test !== '' && !['0', 'off', 'false', 'no'].includes(_test);
  const TEST_TYPE = ['capstone', 'trophy'].includes(_test) ? _test : 'death';
  document.documentElement.lang = LANG;
  const T = {
    fr: { death: '☠ mort hardcore', trophy: '🏆 trophée débloqué', trophyDefault: 'Trophée', attempt: 'TENTATIVE', reached: 'atteint', unlocked: 'débloqué' },
    en: { death: '☠ hardcore death', trophy: '🏆 trophy unlocked', trophyDefault: 'Trophy',  attempt: 'ATTEMPT',   reached: 'reached', unlocked: 'unlocked' },
  }[LANG];
  const TIER_NAMES = {
    fr: { Recrue: 'Recrue',    Adepte: 'Adepte', Champion: 'Champion', Parangon: 'Parangon', Eternal: 'Éternel' },
    en: { Recrue: 'Contender', Adepte: 'Adept',  Champion: 'Champion', Parangon: 'Paragon',  Eternal: 'Eternal' },
  }[LANG];
  // Capstone « Recrue » franchi → on annonce la ligue d'après : « Adepte débloqué » (Éternel est le dernier palier : « atteint »)
  const TIER_KEYS = { recrue:'Recrue', contender:'Recrue', recruit:'Recrue', adepte:'Adepte', adept:'Adepte', champion:'Champion',
                      parangon:'Parangon', paragon:'Parangon', eternal:'Eternal', eternel:'Eternal', 'éternel':'Eternal' };
  const TIER_NEXT = { Recrue:'Adepte', Adepte:'Champion', Champion:'Parangon', Parangon:'Eternal' };
  function tierKeyOf(str) { return TIER_KEYS[String(str || '').trim().split(/\s+/)[0].toLowerCase()] || null; }
  function nextTierKey(str) { return TIER_NEXT[tierKeyOf(str)] || null; }
  // Traduit un libellé stocké en base (« Recrue 2 », « Eternal 5 », « Parangon ») dans la langue choisie
  function tierLabelL(str) {
    const KEYS = { recrue:'Recrue', contender:'Recrue', recruit:'Recrue', adepte:'Adepte', adept:'Adepte', champion:'Champion',
                   parangon:'Parangon', paragon:'Parangon', eternal:'Eternal', eternel:'Eternal', 'éternel':'Eternal' };
    return String(str || '').replace(/^(Recrue|Contender|Recruit|Adepte|Adept|Champion|Parangon|Paragon|Eternal|Eternel|Éternel)/i,
      m => TIER_NAMES[KEYS[m.toLowerCase()] || m] || m);
  }

  // Donjons : nom de zone des logs (EN) → image (../gloire/images/<slug>.jpg) et nom affiché (FR / EN)
  const DUNGEON_SLUGS = {
    'sailorsabyss':'abime-des-marins',   'everdawngrove':'bois-de-laube',
    'godfallquarry':'carriere-tombe-dieu','wraithtidevault':'caveau-de-lamespectre',
    'wyrmheart':'coeur-de-guivre',       'theheartoftuzari':'coeur-de-tuzari',
    'heartoftuzari':'coeur-de-tuzari',   'silkenhollow':'creux-soyeux',
    'stormwatch':'guet-tempete',         'cithrelsfall':'la-chute-cithrel',
    'urrakmarkets':'marche-durrak',      'urrakmarket':'marche-durrak',
    'ruinsofregath':'ruins-of-regath',   'empyreansands':'sables-empyreens',
    'ransackofdrakheim':'saccage-de-drakheim', 'scryerspeak':'scryers-peak',
    'xulthebloodmonolith':'xul-the-blood-monolith',
  };
  const DUNGEON_NAMES = {
    'abime-des-marins':['Abîme des marins',"Sailor's Abyss"], 'bois-de-laube':["Bois de l'aube",'Everdawn Grove'],
    'carriere-tombe-dieu':['Carrière tombe-dieu','Godfall Quarry'], 'caveau-de-lamespectre':['Caveau de Lamespectre','Wraithtide Vault'],
    'coeur-de-guivre':['Cœur de guivre','Wyrmheart'], 'coeur-de-tuzari':['Cœur de Tuzari','The Heart of Tuzari'],
    'creux-soyeux':['Creux soyeux','Silken Hollow'], 'guet-tempete':['Guet-tempête','Stormwatch'],
    'la-chute-cithrel':['La chute Cithrel',"Cithrel's Fall"], 'marche-durrak':["Marché d'Urrak",'Urrak Markets'],
    'ruins-of-regath':['Ruins of Regath','Ruins of Regath'], 'sables-empyreens':['Sables empyréens','Empyrean Sands'],
    'saccage-de-drakheim':['Saccage de Drakheim','Ransack of Drakheim'], 'scryers-peak':["Scryer's Peak","Scryer's Peak"],
    'xul-the-blood-monolith':['Xul, the Blood Monolith','Xul, The Blood Monolith'],
  };
  const dungSlug = n => DUNGEON_SLUGS[String(n || '').toLowerCase().replace(/[^a-z0-9]/g, '')] || null;
  function dungName(n) { const s = dungSlug(n); return s ? DUNGEON_NAMES[s][LANG === 'en' ? 1 : 0] : (n || ''); }

  // Mapping classe → couleur
  const CLASS_COLORS = {
    'Helena':  '#b26731', 'Meiko':   '#29dd5c', 'Xavian':  '#097265',
    'Aeona':   '#f99de9', 'Sylvie':  '#e74f82', 'Vigour':  '#dbd9c3',
    'Rime':    '#1ca2ec', 'Ardeos':  '#e96326', 'Elarion': '#925dfc',
    'Tariq':   '#5179f3', 'Mara':    '#94598e', 'Gunde':   '#933637',
  };

  // Mapping classe → emoji role (à la place d'une image)
  const CLASS_ICONS = {
    'Helena':  '🛡', 'Meiko':   '🛡', 'Xavian':  '🛡',
    'Aeona':   '✨', 'Sylvie':  '✨', 'Vigour':  '✨',
    'Rime':    '⚔', 'Ardeos':  '⚔', 'Elarion': '⚔',
    'Tariq':   '⚔', 'Mara':    '⚔', 'Gunde':   '⚔',
  };

  // Couleurs tier donjons
  const TIER_COLORS = {
    'Recrue': '#00c700', 'Adepte': '#006fe6', 'Champion': '#a920fd',
    'Parangon': '#b79f00', 'Eternal': '#b60000',
  };

  function diffLevelToRank(dl) {
    if (!dl || dl <= 0) return { tier: '', level: 0, label: '—' };
    // Table vérifiée sur FellowshipLogs : dl 16/17/18 = Paragon 1/2/3, dl 22 = Eternal 2,
    // dl 47/48 = Eternal 27/28. Eternal N = dl - 20 ; paliers de 5 niveaux avant.
    if (dl > 20) return { tier: 'Eternal', level: dl - 20, label: `${TIER_NAMES.Eternal} ${dl - 20}` };
    const tiers = ['Recrue', 'Adepte', 'Champion', 'Parangon'];
    const t = Math.floor((dl - 1) / 5);
    const level = ((dl - 1) % 5) + 1;
    return { tier: tiers[t], level, label: `${TIER_NAMES[tiers[t]]} ${level}` };
  }

  function tierColor(tier) {
    return TIER_COLORS[tier] || '#888';
  }
  // Même teinte, version lumineuse : lisible en texte sur le fond sombre de l'alerte
  const TIER_BRIGHT = {
    'Recrue': '#5dff5d', 'Adepte': '#5db0ff', 'Champion': '#d08cff',
    'Parangon': '#ffd83d', 'Eternal': '#ff7b7b',
  };
  function tierBright(tier) { return TIER_BRIGHT[tier] || '#e0e0e0'; }

  // ── SON ─────────────────────────────────────────────────────────────────────
  const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

  function playDeathSound() {
    if (!SOUND_ON) return;
    // Son grave, lourd — knell funèbre
    const t = audioCtx.currentTime;
    const osc1 = audioCtx.createOscillator();
    const osc2 = audioCtx.createOscillator();
    const gain1 = audioCtx.createGain();
    const gain2 = audioCtx.createGain();
    const masterGain = audioCtx.createGain();

    osc1.type = 'sine';
    osc1.frequency.setValueAtTime(110, t);
    osc1.frequency.exponentialRampToValueAtTime(80, t + 1.5);

    osc2.type = 'sine';
    osc2.frequency.setValueAtTime(220, t);
    osc2.frequency.exponentialRampToValueAtTime(160, t + 1.2);

    gain1.gain.setValueAtTime(0.6, t);
    gain1.gain.exponentialRampToValueAtTime(0.001, t + 2.5);

    gain2.gain.setValueAtTime(0.3, t);
    gain2.gain.exponentialRampToValueAtTime(0.001, t + 1.8);

    masterGain.gain.setValueAtTime(0.8, t);

    // Impact initial
    const impactOsc = audioCtx.createOscillator();
    const impactGain = audioCtx.createGain();
    impactOsc.type = 'square';
    impactOsc.frequency.setValueAtTime(60, t);
    impactGain.gain.setValueAtTime(0.4, t);
    impactGain.gain.exponentialRampToValueAtTime(0.001, t + 0.3);

    osc1.connect(gain1); gain1.connect(masterGain);
    osc2.connect(gain2); gain2.connect(masterGain);
    impactOsc.connect(impactGain); impactGain.connect(masterGain);
    masterGain.connect(audioCtx.destination);

    osc1.start(t); osc1.stop(t + 2.5);
    osc2.start(t); osc2.stop(t + 1.8);
    impactOsc.start(t); impactOsc.stop(t + 0.3);
  }

  function playCapstoneSound() {
    if (!SOUND_ON) return;
    // Son montant, victorieux — fanfare courte
    const t = audioCtx.currentTime;
    const notes = [523, 659, 784, 1047]; // Do Mi Sol Do
    notes.forEach((freq, i) => {
      const osc  = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      const start = t + i * 0.12;
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(freq, start);
      gain.gain.setValueAtTime(0, start);
      gain.gain.linearRampToValueAtTime(0.35, start + 0.04);
      gain.gain.exponentialRampToValueAtTime(0.001, start + 0.5);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(start);
      osc.stop(start + 0.5);
    });
    // Sustain final
    const sustain = audioCtx.createOscillator();
    const sGain   = audioCtx.createGain();
    sustain.type = 'sine';
    sustain.frequency.setValueAtTime(1047, t + 0.48);
    sGain.gain.setValueAtTime(0.3, t + 0.48);
    sGain.gain.exponentialRampToValueAtTime(0.001, t + 1.8);
    sustain.connect(sGain);
    sGain.connect(audioCtx.destination);
    sustain.start(t + 0.48);
    sustain.stop(t + 1.8);
  }

  // ── FILE D'ATTENTE ───────────────────────────────────────────────────────────
  let alertQueue = [];
  let isShowing  = false;

  function enqueueAlerts(events) {
    alertQueue.push(...events);
    if (!isShowing) processQueue();
  }

  function processQueue() {
    if (!alertQueue.length) { isShowing = false; return; }
    isShowing = true;
    const evt = alertQueue.shift();
    showAlert(evt);
    setTimeout(processQueue, ALERT_DURATION_MS + 600);
  }

  // ── RENDU ALERTE ─────────────────────────────────────────────────────────────
  function showAlert(evt) {
    const isDeath    = evt.event_type === 'death';
    const isTrophy   = evt.event_type === 'trophy';
    const heroClass  = evt.character_class || '';
    const heroColor  = CLASS_COLORS[heroClass] || '#aaa';
    const heroIcon   = CLASS_ICONS[heroClass]  || '⚔';
    const meta       = evt.metadata || {};
    const dl         = meta.difficulty_level;
    const rank       = dl ? diffLevelToRank(dl) : null;
    const rankColor  = rank ? tierColor(rank.tier) : '#888';

    // Jouer le son
    if (isDeath) playDeathSound();
    else         playCapstoneSound();   // le trophée réutilise le son des capstones

    // Construire la carte
    const wrapper = document.getElementById('alert-wrapper');

    const rankBadgeHtml = rank
      ? `<span class="alert-rank-badge" style="color:${tierBright(rank.tier)};border-color:${rankColor};background:linear-gradient(${rankColor}66,${rankColor}66),rgba(0,0,0,0.7);box-shadow:0 0 14px ${rankColor}99">${rank.label}</span>`
      : '';

    const dungeonHtml = meta.dungeon
      ? `<span class="alert-dungeon">${dungName(meta.dungeon)}</span>`
      : '';
    const dSlug  = dungSlug(meta.dungeon);
    // Médaillon : portrait du héros (mort) ; image du donjon en pleine luminosité (capstone), portrait du héros si elle manque
    const heroSrc   = heroClass ? `../images/heroes/${encodeURIComponent(heroClass.toLowerCase())}.jpg` : '';
    const dungSrc   = dSlug ? `../gloire/images/${dSlug}.jpg` : '';
    const bubbleImg = (!isDeath && dungSrc)
      ? `<img class="bubble-dungeon" src="${dungSrc}" alt="" onerror="${heroSrc ? `this.onerror=function(){this.remove()};this.src='${heroSrc}'` : 'this.remove()'}">`
      : (heroSrc ? `<img src="${heroSrc}" alt="" onerror="this.remove()">` : '');
    const bgHtml = (!isTrophy && dSlug) ? `<div class="alert-bg" style="background-image:url('../gloire/images/${dSlug}.jpg')"></div>` : '';

    let typeLabel, headline, subline, accent;

    if (isDeath) {
      typeLabel = T.death;
      headline  = `
        <span class="alert-player-name" style="color:${heroColor}">${evt.character_name}</span>
        <span class="alert-hero-name" style="color:${heroColor}88">${heroClass}</span>
      `;
      const gsRaw = meta.ps_at_death;
      const gsHtml = (gsRaw !== undefined && gsRaw !== null && gsRaw !== '' && isFinite(gsRaw))
        ? `<span class="alert-gs-badge">GS ${Math.round(Number(gsRaw))}</span>` : '';
      subline = `
        ${dungeonHtml}
        ${rankBadgeHtml}
        ${gsHtml}
      `;
      accent = '💀';
    } else if (isTrophy) {
      const tTxt  = (LANG === 'en' ? meta.en : meta.fr) || meta.fr || meta.en || [];
      const tName = tTxt[0] || T.trophyDefault;
      const tDesc = tTxt[1] || '';
      const tCol  = meta.color || '#ffd36b';
      typeLabel = T.trophy;
      headline  = `
        <span class="alert-player-name" style="color:${heroColor}">${evt.character_name}</span>
        <span class="alert-hero-name" style="color:${heroColor}88">${heroClass}</span>
      `;
      subline = `
        <span class="alert-trophy-name" style="color:${tCol}">${tName}</span>
        <span class="alert-trophy-desc">${tDesc}</span>
      `;
      accent = heroIcon;
    } else {
      // Capstone
      const capTier = tierLabelL(meta.tier_name) || 'Capstone';
      const nextKey = nextTierKey(meta.tier_name);
      const labKey  = nextKey || tierKeyOf(meta.tier_name);          // couleur de la ligue annoncée
      typeLabel = `<span style="color:${tierBright(labKey)};text-shadow:0 0 14px ${tierColor(labKey)},0 1px 4px #000">✦ ${nextKey ? `${TIER_NAMES[nextKey]} ${T.unlocked}` : `${capTier} ${T.reached}`}</span>`;
      headline  = `
        <span class="alert-player-name" style="color:${heroColor}">${evt.character_name}</span>
        <span class="alert-hero-name" style="color:${heroColor}88">${heroClass}</span>
      `;
      subline = `
        ${rankBadgeHtml}
        ${dungeonHtml}
      `;
      accent = rank?.tier === 'Eternal' ? '👑' : '🏆';
    }

    const attemptHtml = isDeath && evt.attempt_number
      ? `<div class="alert-attempt">${T.attempt} #${evt.attempt_number}</div>`
      : '';

    wrapper.innerHTML = `
      <div class="alert-card alert-${isDeath ? 'death' : (isTrophy ? 'trophy' : 'capstone')}">
        ${bgHtml}
        <div class="alert-shimmer"></div>
        <div class="alert-corner tl"></div>
        <div class="alert-corner tr"></div>
        <div class="alert-corner bl"></div>
        <div class="alert-corner br"></div>
        <div class="alert-inner">
          <div class="alert-icon-zone">
            ${isTrophy ? `<img class="trophy-img" src="../images/trophies/${meta.img || meta.trophy_id}.png" data-emoji="${meta.ico || '🏆'}" alt=""
                 onerror="this.replaceWith(Object.assign(document.createElement('span'),{className:'trophy-emoji',textContent:this.dataset.emoji}))">` : `
            <div class="hero-icon" style="
              border-color: ${heroColor};
              background: radial-gradient(circle at 40% 40%, ${heroColor}30, ${heroColor}08);
              color: ${heroColor};
              box-shadow: 0 0 20px ${heroColor}40, inset 0 0 12px ${heroColor}20;
            ">
              <span style="filter:drop-shadow(0 0 6px ${heroColor})">${heroIcon}</span>
              ${bubbleImg}
            </div>`}
          </div>
          <div class="alert-content">
            <div class="alert-type-label">${typeLabel}</div>
            <div class="alert-headline">${headline}</div>
            <div class="alert-subline">${subline}</div>
            ${attemptHtml}
          </div>
          <div class="alert-accent">${accent}</div>
        </div>
      </div>`;

    // Déclencher l'animation
    requestAnimationFrame(() => {
      const card = wrapper.querySelector('.alert-card');
      if (card) card.classList.add('show');
    });
  }

  const MARK_SEEN_URL = `${SUPABASE_URL}/functions/v1/mark-overlay-seen`;

  // ── POLLING SUPABASE ─────────────────────────────────────────────────────────
  const EVENT_SELECT = 'id,event_type,character_name,character_class,attempt_number,metadata,capstone_id';
  const EVENT_TYPES  = 'event_type=in.(death,capstone,trophy)&season=eq.S1';
  const SB_HEADERS   = { 'apikey': SUPABASE_ANON_KEY, 'Authorization': 'Bearer ' + SUPABASE_ANON_KEY };

  // Mode normal : l'overlay « consomme » les alertes (elles sont marquées annoncées pour tout le monde).
  async function pollEvents() {
    try {
      const now = new Date().toISOString();
      const res = await fetch(
        `${SUPABASE_URL}/rest/v1/hm_events` +
        `?announced_overlay=eq.false` +
        `&announce_after=lte.${now}` +
        `&${EVENT_TYPES}` +
        `&order=announce_after.asc` +
        `&limit=10` +
        `&select=${EVENT_SELECT}`,
        { headers: SB_HEADERS }
      );

      if (!res.ok) return;
      const events = await res.json();
      if (!events?.length) return;

      // Marquer via Edge Function (service_role) — la clé anon ne peut pas écrire
      const ids = events.map(e => e.id);
      await fetch(MARK_SEEN_URL, {
        method: 'POST',
        headers: {
          'Content-Type':  'application/json',
          'Authorization': 'Bearer ' + SUPABASE_ANON_KEY,
          'apikey':        SUPABASE_ANON_KEY,
        },
        body: JSON.stringify({ ids }),
      });

      enqueueAlerts(events);
    } catch (e) {
      console.error('Poll error:', e);
    }
  }

  // Mode partagé (?shared=1) : n'écrit rien dans la base. Chaque overlay relit les alertes dont l'heure d'annonce vient
  // de passer et retient dans SON navigateur celles déjà affichées (un rechargement d'OBS ne rejoue rien).
  const SEEN_KEY       = 'hc_overlay_seen_v1';
  const SHARED_START   = Date.now() - 3 * 60 * 1000;   // à l'ouverture : on rattrape les 3 dernières minutes seulement
  const SHARED_KEEP_MS = 6 * 60 * 60 * 1000;
  let seenIds = {};
  try { seenIds = JSON.parse(localStorage.getItem(SEEN_KEY) || '{}'); } catch (e) { seenIds = {}; }
  function rememberSeen(ids) {
    const t = Date.now();
    ids.forEach(id => { seenIds[id] = t; });
    for (const k of Object.keys(seenIds)) if (t - seenIds[k] > SHARED_KEEP_MS) delete seenIds[k];
    try { localStorage.setItem(SEEN_KEY, JSON.stringify(seenIds)); } catch (e) {}
  }
  async function pollEventsShared() {
    try {
      const now   = new Date().toISOString();
      const since = new Date(SHARED_START).toISOString();
      const res = await fetch(
        `${SUPABASE_URL}/rest/v1/hm_events` +
        `?announce_after=gte.${since}&announce_after=lte.${now}` +
        `&${EVENT_TYPES}` +
        `&order=announce_after.asc` +
        `&limit=30` +
        `&select=${EVENT_SELECT},announce_after`,
        { headers: SB_HEADERS }
      );
      if (!res.ok) return;
      // Clé = id + heure d'annonce : rejouer une alerte en SQL (nouvelle heure d'annonce) la fait revenir dans les overlays partagés
      const events = (await res.json()).filter(e => !seenIds[e.id + '@' + e.announce_after] && !alertQueue.some(q => q.id === e.id));
      if (!events.length) return;
      rememberSeen(events.map(e => e.id + '@' + e.announce_after));
      enqueueAlerts(events);
    } catch (e) {
      console.error('Poll error (shared):', e);
    }
  }

  // Alerte de test (?test=1) : événement fictif, sans aucun appel à la base
  function testEvent(type) {
    const base = { id: 'test', character_name: LANG === 'en' ? 'Test Hero' : 'Héros Test', character_class: 'Aeona', attempt_number: 2 };
    if (type === 'trophy') return { ...base, event_type: 'trophy', metadata: {
      trophy_id: 'eternal_5', img: 'Trophy_Eternal_2', ico: '👑', color: '#e04040',
      fr: ['Éternel V', 'Termine un donjon Éternel 5 dans les temps.'], en: ['Eternal V', 'Finish an Eternal 5 dungeon within the time limit.'] } };
    if (type === 'capstone') return { ...base, event_type: 'capstone', metadata: { tier_name: 'Recrue', difficulty_level: 4, dungeon: 'Urrak Markets' } };
    return { ...base, event_type: 'death', metadata: { dungeon: 'Urrak Markets', difficulty_level: 8, ps_at_death: 1840 } };
  }

  // Démarrage
  if (TEST_ON) {
    console.info('[overlay] mode test : une alerte « ' + TEST_TYPE + ' », aucune lecture en base');
    setTimeout(() => enqueueAlerts([testEvent(TEST_TYPE)]), 800);
  } else {
    const poll = SHARED ? pollEventsShared : pollEvents;
    poll();
    setInterval(poll, POLL_INTERVAL_MS);
  }

  // Débloquer AudioContext sur premier clic (requis par les navigateurs)
  document.addEventListener('click', () => {
    if (audioCtx.state === 'suspended') audioCtx.resume();
  }, { once: true });
</script>
